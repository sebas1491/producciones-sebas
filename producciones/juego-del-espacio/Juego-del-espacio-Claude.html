<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>STELLAR VOID — Arcade</title>
<style>
  /* ============================================================
     CSS VARIABLES & RESET
  ============================================================ */
  :root {
    --cyan:    #00ffe7;
    --magenta: #ff2d78;
    --yellow:  #ffe94d;
    --blue:    #1a0533;
    --dark:    #05000f;
    --white:   #e8f4ff;
    --glow-c:  0 0 8px #00ffe7, 0 0 20px #00ffe780;
    --glow-m:  0 0 8px #ff2d78, 0 0 20px #ff2d7880;
    --glow-y:  0 0 8px #ffe94d, 0 0 20px #ffe94d80;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    width:100%; height:100%;
    background:#000;
    overflow:hidden;
    font-family:'Courier New', monospace;
    color:var(--white);
    user-select:none;
  }

  /* ============================================================
     GAME CANVAS CONTAINER
  ============================================================ */
  #game-wrap {
    position:relative;
    width:100vw; height:100vh;
    overflow:hidden;
    background: radial-gradient(ellipse at 50% 60%, #120024 0%, #050010 55%, #000 100%);
  }

  /* ============================================================
     STARFIELD  (3 layers via CSS animation)
  ============================================================ */
  .star-layer {
    position:absolute; inset:0;
    pointer-events:none;
  }
  /* Stars are rendered as box-shadows on a 1×1 div — generated by JS */
  #stars1 { opacity:.55; }
  #stars2 { opacity:.75; }
  #stars3 { opacity:1;   }

  /* ============================================================
     HUD
  ============================================================ */
  #hud {
    position:absolute; top:0; left:0; right:0;
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 22px;
    background:linear-gradient(180deg,rgba(0,0,20,.9) 0%,transparent 100%);
    z-index:50;
    border-bottom:1px solid #00ffe720;
  }
  #hud-left, #hud-right { display:flex; flex-direction:column; gap:4px; min-width:180px; }
  #hud-right { align-items:flex-end; }

  .hud-label {
    font-size:9px; letter-spacing:.25em; text-transform:uppercase;
    color:#00ffe799; margin-bottom:1px;
  }
  .hud-value {
    font-size:22px; letter-spacing:.1em;
    color:var(--cyan); text-shadow:var(--glow-c);
    font-weight:700;
  }

  /* Lives */
  #lives-row { display:flex; gap:7px; align-items:center; margin-top:3px; }
  .life-icon {
    width:18px; height:18px; position:relative;
    transition:opacity .3s;
  }
  .life-icon::before {
    content:'';
    position:absolute; inset:0;
    clip-path: polygon(50% 0%, 100% 38%, 80% 100%, 20% 100%, 0% 38%);
    background:var(--cyan);
    box-shadow:var(--glow-c);
  }
  .life-icon.dead::before { background:#333; box-shadow:none; }

  /* Weapon charge bar */
  #weapon-wrap { margin-top:4px; }
  #weapon-bar-bg {
    width:140px; height:7px;
    background:#ffffff18;
    border:1px solid #00ffe740;
    border-radius:4px; overflow:hidden;
  }
  #weapon-bar {
    height:100%; width:100%;
    background:linear-gradient(90deg, var(--cyan), #00b8ff);
    box-shadow:var(--glow-c);
    border-radius:4px;
    transition:width .05s linear;
  }

  /* Hyperspace */
  #hyper-wrap { margin-top:4px; }
  #hyper-pip-row { display:flex; gap:5px; }
  .hyper-pip {
    width:12px; height:12px;
    border:1px solid var(--magenta);
    border-radius:50%;
    box-shadow:var(--glow-m);
    transition:background .3s;
  }
  .hyper-pip.ready { background:var(--magenta); }

  /* Center score flash */
  #score-flash {
    position:absolute; top:80px; left:50%;
    transform:translateX(-50%);
    font-size:28px; color:var(--yellow);
    text-shadow:var(--glow-y);
    opacity:0; pointer-events:none;
    z-index:60;
    transition:opacity .1s;
    letter-spacing:.2em;
  }

  /* Level badge */
  #level-badge {
    position:absolute; top:80px; left:50%;
    transform:translateX(-50%);
    font-size:13px; letter-spacing:.3em; color:var(--cyan);
    text-shadow:var(--glow-c);
    opacity:0; pointer-events:none; z-index:60;
  }

  /* ============================================================
     SHIP  (pure CSS polygon)
  ============================================================ */
  #ship {
    position:absolute; width:40px; height:50px;
    transform-origin:center center;
    z-index:20;
    /* will be positioned by JS */
  }

  /* Ship body */
  #ship-body {
    position:absolute; inset:0;
    clip-path: polygon(50% 0%, 100% 90%, 85% 72%, 50% 82%, 15% 72%, 0% 90%);
    background:linear-gradient(160deg, #a0e4ff 0%, #3ab8e8 40%, #145a80 100%);
    box-shadow: 0 0 12px #00ffe740, inset 0 0 10px #ffffff30;
  }
  /* Cockpit */
  #ship-cockpit {
    position:absolute; width:14px; height:14px;
    top:8px; left:50%; transform:translateX(-50%);
    background:radial-gradient(circle, #ffffffcc 0%, #00ffe780 60%, transparent 100%);
    border-radius:50%;
    box-shadow:0 0 10px #00ffe7cc;
  }
  /* Wing accents */
  #ship::before, #ship::after {
    content:'';
    position:absolute;
    width:10px; height:22px;
    background:linear-gradient(180deg, var(--cyan) 0%, transparent 100%);
    opacity:.6;
    top:30px;
    clip-path:polygon(50% 0%,100% 100%,0% 100%);
  }
  #ship::before { left:2px; transform:rotate(-20deg); }
  #ship::after  { right:2px; transform:rotate(20deg); }

  /* Thruster flames */
  #thruster {
    position:absolute; bottom:-18px; left:50%;
    transform:translateX(-50%);
    display:flex; gap:3px; align-items:flex-start;
    pointer-events:none;
  }
  .flame {
    border-radius:50% 50% 50% 50% / 20% 20% 80% 80%;
    animation:flicker .1s infinite alternate;
  }
  .flame-c { /* center */
    width:10px; height:24px;
    background:linear-gradient(180deg,#fff 0%,var(--cyan) 40%,#ff8c00 80%,transparent 100%);
    box-shadow:0 0 10px var(--cyan);
  }
  .flame-l, .flame-r {
    width:7px; height:16px;
    background:linear-gradient(180deg,var(--cyan) 0%,#ff4400 70%,transparent 100%);
    opacity:.8;
  }
  @keyframes flicker {
    from { transform:scaleX(1) scaleY(1); }
    to   { transform:scaleX(.85) scaleY(.92); }
  }

  /* Invincibility blink */
  @keyframes shipBlink {
    0%,100%{opacity:1} 50%{opacity:.2}
  }

  /* ============================================================
     LASER
  ============================================================ */
  .laser {
    position:absolute;
    width:4px;
    background:linear-gradient(180deg, #fff 0%, var(--cyan) 40%, transparent 100%);
    border-radius:2px;
    box-shadow:0 0 8px var(--cyan), 0 0 16px var(--cyan);
    z-index:15;
    pointer-events:none;
  }

  /* ============================================================
     ASTEROID
  ============================================================ */
  .asteroid {
    position:absolute;
    border-radius:40% 55% 48% 52% / 50% 42% 55% 45%;
    background:radial-gradient(ellipse at 35% 35%, #9a8070 0%, #5a4838 45%, #2a1f18 100%);
    border:1px solid #ffffff22;
    box-shadow:inset -4px -4px 10px rgba(0,0,0,.6), inset 2px 2px 6px rgba(255,255,255,.1);
    z-index:10;
    pointer-events:none;
  }
  /* crater texture via pseudo-elements */
  .asteroid::before {
    content:'';
    position:absolute;
    width:35%; height:35%;
    border-radius:50%;
    background:rgba(0,0,0,.35);
    top:20%; left:25%;
    box-shadow:1px 1px 3px rgba(255,255,255,.08);
  }
  .asteroid::after {
    content:'';
    position:absolute;
    width:20%; height:20%;
    border-radius:50%;
    background:rgba(0,0,0,.3);
    top:55%; left:55%;
  }

  /* ============================================================
     EXPLOSION / FRAGMENT
  ============================================================ */
  .fragment {
    position:absolute;
    border-radius:30% 50% 40% 60% / 60% 40% 55% 35%;
    background:radial-gradient(ellipse,#7a6050,#3a2a1f);
    border:1px solid #ffffff1a;
    z-index:10;
    pointer-events:none;
  }
  .explosion-particle {
    position:absolute;
    border-radius:50%;
    z-index:25;
    pointer-events:none;
    animation:explode .6s ease-out forwards;
  }
  @keyframes explode {
    from { transform:scale(1); opacity:1; }
    to   { transform:scale(0); opacity:0; }
  }

  /* ============================================================
     HYPERSPACE EFFECT
  ============================================================ */
  #hyper-flash {
    position:absolute; inset:0;
    background:radial-gradient(ellipse at 50% 50%, #ffffffcc 0%, transparent 70%);
    opacity:0; z-index:80; pointer-events:none;
    transition:opacity .1s;
  }

  /* ============================================================
     SCREENS  (start / game-over)
  ============================================================ */
  .screen {
    position:absolute; inset:0;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    z-index:100; gap:18px;
    background:radial-gradient(ellipse at 50% 50%, #0d0020cc 0%, #000000ee 100%);
  }
  .screen-title {
    font-size:clamp(36px,6vw,72px);
    letter-spacing:.25em; text-transform:uppercase;
    color:var(--cyan); text-shadow:var(--glow-c);
    animation:titlePulse 2s ease-in-out infinite alternate;
  }
  @keyframes titlePulse {
    from { text-shadow: 0 0 10px var(--cyan), 0 0 30px var(--cyan); }
    to   { text-shadow: 0 0 20px var(--cyan), 0 0 60px var(--cyan), 0 0 100px #00ffe730; }
  }
  .screen-sub {
    font-size:13px; letter-spacing:.2em; color:#ffffff88;
    text-transform:uppercase;
  }
  .screen-btn {
    margin-top:10px;
    padding:14px 48px;
    font-family:'Courier New',monospace;
    font-size:16px; letter-spacing:.3em; text-transform:uppercase;
    color:var(--dark); background:var(--cyan);
    border:none; cursor:pointer;
    clip-path:polygon(8px 0%,100% 0%,calc(100% - 8px) 100%,0% 100%);
    box-shadow:var(--glow-c);
    transition:transform .1s, box-shadow .1s;
  }
  .screen-btn:hover {
    transform:scale(1.05);
    box-shadow:0 0 20px var(--cyan), 0 0 40px var(--cyan);
  }
  .final-score { font-size:42px; color:var(--yellow); text-shadow:var(--glow-y); letter-spacing:.1em; }
  .score-label { font-size:10px; letter-spacing:.4em; color:#ffffff60; text-transform:uppercase; }

  /* Controls legend */
  .controls-grid {
    display:grid; grid-template-columns:repeat(2,1fr); gap:6px 24px;
    font-size:11px; letter-spacing:.1em; color:#ffffff55;
    border-top:1px solid #ffffff15; padding-top:14px; margin-top:4px;
  }
  .ctrl-key { color:var(--cyan); }

  /* ============================================================
     SCANLINES overlay
  ============================================================ */
  #scanlines {
    position:absolute; inset:0; z-index:200;
    pointer-events:none;
    background:repeating-linear-gradient(
      0deg,
      transparent,
      transparent 3px,
      rgba(0,0,0,.07) 3px,
      rgba(0,0,0,.07) 4px
    );
  }
  /* subtle vignette */
  #vignette {
    position:absolute; inset:0; z-index:199; pointer-events:none;
    background:radial-gradient(ellipse at 50% 50%, transparent 55%, rgba(0,0,10,.7) 100%);
  }
</style>
</head>
<body>
<div id="game-wrap">

  <!-- Starfield layers -->
  <div class="star-layer" id="stars1"></div>
  <div class="star-layer" id="stars2"></div>
  <div class="star-layer" id="stars3"></div>

  <!-- HUD -->
  <div id="hud">
    <div id="hud-left">
      <span class="hud-label">Puntuación</span>
      <span class="hud-value" id="score-display">000000</span>
      <div id="lives-row"></div>
    </div>
    <div id="hud-center" style="text-align:center;">
      <span class="hud-label" style="text-align:center;display:block;">Nivel</span>
      <span class="hud-value" id="level-display" style="color:var(--magenta);text-shadow:var(--glow-m);">01</span>
    </div>
    <div id="hud-right">
      <span class="hud-label">Cañón láser</span>
      <div id="weapon-wrap">
        <div id="weapon-bar-bg"><div id="weapon-bar"></div></div>
      </div>
      <span class="hud-label" style="margin-top:8px;">Hiperespacio</span>
      <div id="hyper-wrap">
        <div id="hyper-pip-row"></div>
      </div>
    </div>
  </div>

  <!-- Score flash -->
  <div id="score-flash">+100</div>
  <!-- Level badge -->
  <div id="level-badge">NIVEL 2</div>

  <!-- Ship -->
  <div id="ship">
    <div id="ship-body"></div>
    <div id="ship-cockpit"></div>
    <div id="thruster">
      <div class="flame flame-l"></div>
      <div class="flame flame-c"></div>
      <div class="flame flame-r"></div>
    </div>
  </div>

  <!-- Hyperspace flash -->
  <div id="hyper-flash"></div>

  <!-- Scanlines / Vignette -->
  <div id="vignette"></div>
  <div id="scanlines"></div>

  <!-- START SCREEN -->
  <div class="screen" id="start-screen">
    <div class="screen-title">STELLAR VOID</div>
    <div class="screen-sub">Campo de asteroides — Zona peligrosa</div>
    <button class="screen-btn" id="start-btn">Iniciar Misión</button>
    <div class="controls-grid">
      <div><span class="ctrl-key">↑↓←→</span> Mover nave</div>
      <div><span class="ctrl-key">ESPACIO</span> Disparar láser</div>
      <div><span class="ctrl-key">H</span> Hiperespacio</div>
      <div><span class="ctrl-key">P</span> Pausar</div>
    </div>
  </div>

  <!-- GAME OVER SCREEN -->
  <div class="screen" id="gameover-screen" style="display:none;">
    <div class="screen-title" style="color:var(--magenta);text-shadow:var(--glow-m);">MISIÓN FALLIDA</div>
    <div class="score-label">Puntuación Final</div>
    <div class="final-score" id="final-score-display">000000</div>
    <div class="score-label" id="final-level-display">Nivel alcanzado: 1</div>
    <button class="screen-btn" id="restart-btn" style="background:var(--magenta);box-shadow:var(--glow-m);">Reintentar</button>
  </div>

</div>

<script>
/* ================================================================
   STELLAR VOID — Arcade Space Game
   Single-file HTML/CSS/JS  •  No external libraries
   ================================================================ */

// ----------------------------------------------------------------
// UTILITIES
// ----------------------------------------------------------------
const $ = id => document.getElementById(id);
const rand = (min, max) => Math.random() * (max - min) + min;
const randInt = (min, max) => Math.floor(rand(min, max + 1));
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
const PI2 = Math.PI * 2;

// ----------------------------------------------------------------
// STARFIELD GENERATION
// ----------------------------------------------------------------
(function buildStars() {
  function makeStars(count, minSize, maxSize, color) {
    const W = window.innerWidth, H = window.innerHeight;
    let shadows = [];
    for (let i = 0; i < count; i++) {
      const x = randInt(0, W), y = randInt(0, H);
      const s = rand(minSize, maxSize).toFixed(1);
      shadows.push(`${x}px ${y}px ${s}px ${s}px ${color}`);
    }
    return shadows.join(',');
  }
  // Layer 1: tiny dim stars
  const s1 = document.createElement('div');
  s1.style.cssText = 'position:absolute;width:1px;height:1px;';
  s1.style.boxShadow = makeStars(200, 0.3, 1.0, '#ffffff66');
  $('stars1').appendChild(s1);

  // Layer 2: medium stars
  const s2 = document.createElement('div');
  s2.style.cssText = 'position:absolute;width:1px;height:1px;';
  s2.style.boxShadow = makeStars(100, 0.5, 1.5, '#ffffffaa');
  $('stars2').appendChild(s2);

  // Layer 3: bright stars
  const s3 = document.createElement('div');
  s3.style.cssText = 'position:absolute;width:1px;height:1px;';
  s3.style.boxShadow = makeStars(50, 1, 2.5, '#ffffffdd');
  $('stars3').appendChild(s3);
})();

// Parallax star movement (applied each frame)
const starLayers = [
  { el: $('stars1'), speed: 0.08 },
  { el: $('stars2'), speed: 0.18 },
  { el: $('stars3'), speed: 0.32 },
];

// ----------------------------------------------------------------
// GAME STATE
// ----------------------------------------------------------------
const STATE = {
  running: false,
  paused: false,
  score: 0,
  level: 1,
  lives: 3,
  maxLives: 5,
  starOffset: 0,       // parallax offset accumulator

  // Ship
  ship: null,

  // Entity arrays
  lasers: [],
  asteroids: [],
  fragments: [],
  particles: [],

  // Timers / cooldowns
  lastFrame: 0,
  spawnTimer: 0,
  spawnInterval: 2200,   // ms between asteroid spawns
  weaponCharge: 1.0,     // 0–1
  weaponCooldown: 480,   // ms
  weaponRecharging: false,
  weaponTimer: 0,
  hyperCharges: 3,
  hyperMax: 3,
  hyperCooldown: 12000,  // ms
  hyperTimer: 0,
  hyperReady: true,
  invincible: false,
  invincibleTimer: 0,
  invincibleDuration: 2200,

  // Score flash
  flashTimer: 0,
  levelUpTimer: 0,
};

// ----------------------------------------------------------------
// SHIP CLASS
// ----------------------------------------------------------------
class Ship {
  constructor() {
    this.el = $('ship');
    this.thruster = $('thruster');
    this.x = window.innerWidth / 2;
    this.y = window.innerHeight / 2;
    this.vx = 0;
    this.vy = 0;
    this.rotation = 0;  // degrees (0 = facing up)
    this.accel = 420;
    this.drag = 0.018;
    this.maxSpeed = 340;
    this.width = 36;
    this.height = 46;
    this.halfW = this.width / 2;
    this.halfH = this.height / 2;
    this.update(0);
  }

  update(dt) {
    const keys = INPUT.keys;
    let ax = 0, ay = 0;

    if (keys['ArrowLeft']  || keys['a'] || keys['A']) ax -= this.accel;
    if (keys['ArrowRight'] || keys['d'] || keys['D']) ax += this.accel;
    if (keys['ArrowUp']    || keys['w'] || keys['W']) ay -= this.accel;
    if (keys['ArrowDown']  || keys['s'] || keys['S']) ay += this.accel;

    // Normalize diagonal
    if (ax !== 0 && ay !== 0) { ax *= 0.707; ay *= 0.707; }

    this.vx += ax * dt;
    this.vy += ay * dt;

    // Drag
    this.vx *= (1 - this.drag * 60 * dt);
    this.vy *= (1 - this.drag * 60 * dt);

    // Speed cap
    const spd = Math.hypot(this.vx, this.vy);
    if (spd > this.maxSpeed) {
      this.vx = (this.vx / spd) * this.maxSpeed;
      this.vy = (this.vy / spd) * this.maxSpeed;
    }

    this.x += this.vx * dt;
    this.y += this.vy * dt;

    // Screen wrapping
    const W = window.innerWidth, H = window.innerHeight;
    if (this.x < -this.halfW) this.x = W + this.halfW;
    if (this.x > W + this.halfW) this.x = -this.halfW;
    if (this.y < -this.halfH) this.y = H + this.halfH;
    if (this.y > H + this.halfH) this.y = -this.halfH;

    // Rotation toward movement
    if (Math.abs(this.vx) > 10 || Math.abs(this.vy) > 10) {
      const targetAngle = Math.atan2(this.vx, -this.vy) * 180 / Math.PI;
      let diff = targetAngle - this.rotation;
      while (diff > 180) diff -= 360;
      while (diff < -180) diff += 360;
      this.rotation += diff * 0.12;
    }

    // Thruster scale based on speed
    const thrustScale = clamp(spd / this.maxSpeed, 0.15, 1.0);
    this.thruster.style.transform = `translateX(-50%) scaleY(${thrustScale})`;

    this.el.style.left = (this.x - this.halfW) + 'px';
    this.el.style.top  = (this.y - this.halfH) + 'px';
    this.el.style.transform = `rotate(${this.rotation}deg)`;
  }

  // Get tip position (for laser spawn)
  tipPos() {
    const rad = this.rotation * Math.PI / 180;
    return {
      x: this.x + Math.sin(rad) * this.halfH,
      y: this.y - Math.cos(rad) * this.halfH,
    };
  }
}

// ----------------------------------------------------------------
// LASER CLASS
// ----------------------------------------------------------------
let laserIdCounter = 0;
class Laser {
  constructor(x, y, angle) {
    this.id = laserIdCounter++;
    this.x = x; this.y = y;
    this.speed = 680;
    const rad = angle * Math.PI / 180;
    this.vx = Math.sin(rad) * this.speed;
    this.vy = -Math.cos(rad) * this.speed;
    this.length = 26;
    this.dead = false;

    this.el = document.createElement('div');
    this.el.className = 'laser';
    this.el.style.height = this.length + 'px';
    this.el.style.transform = `rotate(${angle}deg)`;
    $('game-wrap').appendChild(this.el);
    this._updatePos();
  }

  update(dt) {
    this.x += this.vx * dt;
    this.y += this.vy * dt;
    const W = window.innerWidth, H = window.innerHeight;
    if (this.x < -20 || this.x > W + 20 || this.y < -20 || this.y > H + 20) {
      this.dead = true;
    }
    this._updatePos();
  }

  _updatePos() {
    this.el.style.left = (this.x - 2) + 'px';
    this.el.style.top  = (this.y - this.length / 2) + 'px';
  }

  destroy() {
    this.el.remove();
  }
}

// ----------------------------------------------------------------
// ASTEROID CLASS
// ----------------------------------------------------------------
let asteroidIdCounter = 0;
class Asteroid {
  constructor(x, y, size, vx, vy) {
    this.id = asteroidIdCounter++;
    this.size = size;    // 'large'|'medium'|'small'
    this.r = { large: rand(45,62), medium: rand(26,38), small: rand(12,20) }[size];
    this.x = x !== undefined ? x : this._spawnEdge().x;
    this.y = y !== undefined ? y : this._spawnEdge().y;

    const baseSpeed = (1 + STATE.level * 0.22) * (size === 'large' ? 1 : size === 'medium' ? 1.4 : 1.9);
    if (vx !== undefined && vy !== undefined) {
      this.vx = vx; this.vy = vy;
    } else {
      const cx = window.innerWidth / 2, cy = window.innerHeight / 2;
      const angle = Math.atan2(cy - this.y, cx - this.x) + rand(-0.7, 0.7);
      const spd = rand(baseSpeed * 55, baseSpeed * 90);
      this.vx = Math.cos(angle) * spd;
      this.vy = Math.sin(angle) * spd;
    }

    this.rotSpeed = rand(-120, 120);
    this.rotation = rand(0, 360);
    this.dead = false;
    this.points = { large: 80, medium: 160, small: 260 }[size];

    // Unique shape variation via border-radius
    const shapes = [
      '40% 55% 48% 52% / 50% 42% 55% 45%',
      '55% 40% 52% 48% / 42% 55% 45% 50%',
      '48% 52% 40% 60% / 55% 48% 42% 52%',
      '60% 40% 55% 45% / 40% 60% 48% 52%',
      '35% 55% 50% 60% / 55% 35% 60% 45%',
    ];
    this.shapeCss = shapes[Math.floor(rand(0, shapes.length))];

    this.el = document.createElement('div');
    this.el.className = 'asteroid';
    const d = this.r * 2;
    this.el.style.width = d + 'px';
    this.el.style.height = d + 'px';
    this.el.style.borderRadius = this.shapeCss;
    this._updatePos();
    $('game-wrap').appendChild(this.el);
  }

  _spawnEdge() {
    const W = window.innerWidth, H = window.innerHeight;
    const edge = randInt(0, 3);
    let x, y;
    if (edge === 0) { x = rand(0, W); y = -80; }
    else if (edge === 1) { x = W + 80; y = rand(0, H); }
    else if (edge === 2) { x = rand(0, W); y = H + 80; }
    else { x = -80; y = rand(0, H); }
    return { x, y };
  }

  update(dt) {
    this.x += this.vx * dt;
    this.y += this.vy * dt;
    this.rotation += this.rotSpeed * dt;

    // Off-screen: wrap or kill if tiny
    const W = window.innerWidth, H = window.innerHeight;
    const margin = this.r + 100;
    if (this.x < -margin || this.x > W + margin || this.y < -margin || this.y > H + margin) {
      if (this.size === 'small') { this.dead = true; return; }
      // re-spawn from edge
      const sp = this._spawnEdge();
      this.x = sp.x; this.y = sp.y;
      const cx = W / 2, cy = H / 2;
      const angle = Math.atan2(cy - this.y, cx - this.x) + rand(-0.5, 0.5);
      const spd = Math.hypot(this.vx, this.vy);
      this.vx = Math.cos(angle) * spd;
      this.vy = Math.sin(angle) * spd;
    }

    this._updatePos();
  }

  _updatePos() {
    this.el.style.left = (this.x - this.r) + 'px';
    this.el.style.top  = (this.y - this.r) + 'px';
    this.el.style.transform = `rotate(${this.rotation}deg)`;
  }

  destroy() { this.el.remove(); }
}

// ----------------------------------------------------------------
// FRAGMENT CLASS  (mini asteroids from explosions)
// ----------------------------------------------------------------
class Fragment {
  constructor(x, y, vx, vy) {
    this.x = x; this.y = y;
    this.vx = vx + rand(-60, 60);
    this.vy = vy + rand(-60, 60);
    this.r = rand(6, 11);
    this.rotation = rand(0, 360);
    this.rotSpeed = rand(-200, 200);
    this.life = rand(1.4, 2.6);
    this.age = 0;
    this.dead = false;

    this.el = document.createElement('div');
    this.el.className = 'fragment';
    const d = this.r * 2;
    this.el.style.width = d + 'px';
    this.el.style.height = d + 'px';
    $('game-wrap').appendChild(this.el);
    this._updatePos();
  }

  update(dt) {
    this.age += dt;
    if (this.age >= this.life) { this.dead = true; return; }
    this.x += this.vx * dt;
    this.y += this.vy * dt;
    this.rotation += this.rotSpeed * dt;
    this.vx *= (1 - 0.5 * dt);
    this.vy *= (1 - 0.5 * dt);
    const opacity = 1 - (this.age / this.life);
    this.el.style.opacity = opacity;
    this._updatePos();
  }

  _updatePos() {
    this.el.style.left = (this.x - this.r) + 'px';
    this.el.style.top  = (this.y - this.r) + 'px';
    this.el.style.transform = `rotate(${this.rotation}deg)`;
  }

  destroy() { this.el.remove(); }
}

// ----------------------------------------------------------------
// PARTICLE (explosion sparks)
// ----------------------------------------------------------------
class Particle {
  constructor(x, y, color) {
    this.el = document.createElement('div');
    this.el.className = 'explosion-particle';
    const size = rand(4, 10);
    this.el.style.width = size + 'px';
    this.el.style.height = size + 'px';
    this.el.style.background = color;
    this.el.style.boxShadow = `0 0 6px ${color}`;
    this.el.style.left = x + 'px';
    this.el.style.top  = y + 'px';
    const angle = rand(0, PI2);
    const spd = rand(80, 280);
    this.vx = Math.cos(angle) * spd;
    this.vy = Math.sin(angle) * spd;
    this.life = rand(.4, .8);
    this.age = 0;
    this.dead = false;
    $('game-wrap').appendChild(this.el);
  }

  update(dt) {
    this.age += dt;
    if (this.age >= this.life) { this.dead = true; return; }
    const x = parseFloat(this.el.style.left) + this.vx * dt;
    const y = parseFloat(this.el.style.top)  + this.vy * dt;
    this.el.style.left = x + 'px';
    this.el.style.top  = y + 'px';
    this.el.style.opacity = 1 - this.age / this.life;
  }

  destroy() { this.el.remove(); }
}

// ----------------------------------------------------------------
// INPUT HANDLER
// ----------------------------------------------------------------
const INPUT = {
  keys: {},
  justPressed: {},

  init() {
    window.addEventListener('keydown', e => {
      if (!this.keys[e.key]) this.justPressed[e.key] = true;
      this.keys[e.key] = true;
      if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key)) {
        e.preventDefault();
      }
    });
    window.addEventListener('keyup', e => {
      this.keys[e.key] = false;
    });
  },

  consume(key) {
    const v = this.justPressed[key];
    this.justPressed[key] = false;
    return v;
  },

  clearJust() {
    this.justPressed = {};
  }
};
INPUT.init();

// ----------------------------------------------------------------
// HUD HELPERS
// ----------------------------------------------------------------
function updateHUD() {
  $('score-display').textContent = String(STATE.score).padStart(6, '0');
  $('level-display').textContent = String(STATE.level).padStart(2, '0');

  // Lives
  const livesRow = $('lives-row');
  livesRow.innerHTML = '';
  for (let i = 0; i < STATE.maxLives; i++) {
    const icon = document.createElement('div');
    icon.className = 'life-icon' + (i >= STATE.lives ? ' dead' : '');
    livesRow.appendChild(icon);
  }

  // Weapon charge
  $('weapon-bar').style.width = (STATE.weaponCharge * 100) + '%';
  $('weapon-bar').style.background = STATE.weaponCharge < 0.25
    ? 'linear-gradient(90deg, var(--magenta), #ff0050)'
    : 'linear-gradient(90deg, var(--cyan), #00b8ff)';

  // Hyper pips
  const pipRow = $('hyper-pip-row');
  pipRow.innerHTML = '';
  for (let i = 0; i < STATE.hyperMax; i++) {
    const pip = document.createElement('div');
    pip.className = 'hyper-pip' + (i < STATE.hyperCharges && STATE.hyperReady ? ' ready' : '');
    pipRow.appendChild(pip);
  }
}

function showScoreFlash(pts) {
  const el = $('score-flash');
  el.textContent = '+' + pts;
  el.style.opacity = '1';
  STATE.flashTimer = 0.9;
}

function showLevelBadge(level) {
  const el = $('level-badge');
  el.textContent = '— NIVEL ' + level + ' —';
  el.style.opacity = '1';
  STATE.levelUpTimer = 2.5;
}

// ----------------------------------------------------------------
// GAME LOGIC
// ----------------------------------------------------------------
function spawnAsteroid() {
  const roll = Math.random();
  let size;
  if (STATE.level < 3) {
    size = roll < 0.65 ? 'large' : 'medium';
  } else if (STATE.level < 6) {
    size = roll < 0.45 ? 'large' : roll < 0.78 ? 'medium' : 'small';
  } else {
    size = roll < 0.3 ? 'large' : roll < 0.65 ? 'medium' : 'small';
  }
  STATE.asteroids.push(new Asteroid(undefined, undefined, size));
}

function explodeAsteroid(ast, fromLaser) {
  // Particles
  const colors = ['#ff8040','#ffcc44','#ffffff','#ff4444'];
  for (let i = 0; i < 14; i++) {
    STATE.particles.push(new Particle(ast.x, ast.y, colors[randInt(0, colors.length - 1)]));
  }

  // Fragments
  if (ast.size !== 'small') {
    const childSize = ast.size === 'large' ? 'medium' : 'small';
    const numChildren = randInt(2, 4);
    for (let i = 0; i < numChildren; i++) {
      const angle = rand(0, PI2);
      const spd = rand(80, 160);
      STATE.asteroids.push(new Asteroid(
        ast.x + Math.cos(angle) * ast.r * 0.5,
        ast.y + Math.sin(angle) * ast.r * 0.5,
        childSize,
        ast.vx + Math.cos(angle) * spd,
        ast.vy + Math.sin(angle) * spd
      ));
    }
    // Also spawn debris fragments (visual only)
    for (let i = 0; i < 6; i++) {
      const a = rand(0, PI2), s = rand(60, 180);
      STATE.fragments.push(new Fragment(ast.x, ast.y, ast.vx + Math.cos(a) * s, ast.vy + Math.sin(a) * s));
    }
  } else {
    // tiny flash fragments
    for (let i = 0; i < 3; i++) {
      const a = rand(0, PI2), s = rand(40, 120);
      STATE.fragments.push(new Fragment(ast.x, ast.y, Math.cos(a) * s, Math.sin(a) * s));
    }
  }

  STATE.score += ast.points;
  showScoreFlash(ast.points);
  ast.dead = true;
  ast.destroy();

  // Level-up check
  checkLevelUp();
}

function checkLevelUp() {
  const thresholds = [0, 500, 1200, 2200, 3800, 6000, 9000, 13000, 18000, 25000];
  for (let i = thresholds.length - 1; i >= 1; i--) {
    if (STATE.score >= thresholds[i] && STATE.level < i + 1) {
      STATE.level = i + 1;
      STATE.spawnInterval = Math.max(500, 2200 - STATE.level * 160);
      showLevelBadge(STATE.level);
      break;
    }
  }
}

function shipHit() {
  if (STATE.invincible) return;
  STATE.lives--;
  updateHUD();
  if (STATE.lives <= 0) {
    gameOver();
    return;
  }
  STATE.invincible = true;
  STATE.invincibleTimer = STATE.invincibleDuration;
  STATE.ship.el.style.animation = `shipBlink ${STATE.invincibleDuration}ms step-start`;
}

function hyperspace() {
  if (STATE.hyperCharges <= 0 || !STATE.hyperReady) return;
  STATE.hyperCharges--;
  if (STATE.hyperCharges === 0) {
    STATE.hyperReady = false;
    STATE.hyperTimer = STATE.hyperCooldown;
  }

  // Flash effect
  const flash = $('hyper-flash');
  flash.style.opacity = '0.9';
  setTimeout(() => flash.style.opacity = '0', 150);

  // Teleport
  const W = window.innerWidth, H = window.innerHeight;
  const margin = 80;
  STATE.ship.x = rand(margin, W - margin);
  STATE.ship.y = rand(margin, H - margin);
  STATE.ship.vx = 0;
  STATE.ship.vy = 0;

  // 15% fail chance: spawn near an asteroid
  if (Math.random() < 0.15 && STATE.asteroids.length > 0) {
    const ast = STATE.asteroids[randInt(0, STATE.asteroids.length - 1)];
    STATE.ship.x = ast.x + rand(-40, 40);
    STATE.ship.y = ast.y + rand(-40, 40);
    shipHit();
  }

  updateHUD();
}

// ----------------------------------------------------------------
// CIRCLE-BASED COLLISION  (fast & works with rotation)
// ----------------------------------------------------------------
function circleCollide(ax, ay, ar, bx, by, br) {
  const dx = ax - bx, dy = ay - by;
  return dx * dx + dy * dy < (ar + br) * (ar + br);
}

// ----------------------------------------------------------------
// MAIN GAME LOOP
// ----------------------------------------------------------------
function gameLoop(ts) {
  if (!STATE.running) return;
  requestAnimationFrame(gameLoop);

  const dt = Math.min((ts - STATE.lastFrame) / 1000, 0.05); // cap at 50ms
  STATE.lastFrame = ts;

  if (STATE.paused) return;

  const W = window.innerWidth, H = window.innerHeight;

  // --- Input ---
  // Fire laser
  if ((INPUT.keys[' '] || INPUT.keys['x'] || INPUT.keys['X']) && STATE.weaponCharge >= 1.0) {
    const tip = STATE.ship.tipPos();
    STATE.lasers.push(new Laser(tip.x, tip.y, STATE.ship.rotation));
    STATE.weaponCharge = 0;
    STATE.weaponRecharging = true;
    STATE.weaponTimer = 0;
  }

  // Hyperspace
  if (INPUT.consume('h') || INPUT.consume('H')) {
    hyperspace();
  }

  // Pause
  if (INPUT.consume('p') || INPUT.consume('P')) {
    STATE.paused = true;
    // Simple pause overlay
    const po = document.createElement('div');
    po.id = 'pause-overlay';
    po.style.cssText = `position:absolute;inset:0;background:#00000099;z-index:90;
      display:flex;align-items:center;justify-content:center;
      font-size:48px;letter-spacing:.3em;color:#00ffe7;
      text-shadow:0 0 20px #00ffe7;font-family:'Courier New',monospace;`;
    po.textContent = 'PAUSA';
    po.onclick = () => { STATE.paused = false; STATE.lastFrame = performance.now(); po.remove(); };
    $('game-wrap').appendChild(po);
  }

  INPUT.clearJust();

  // --- Parallax starfield ---
  STATE.starOffset += dt * 30;
  starLayers.forEach(l => {
    const child = l.el.firstChild;
    if (child) {
      const offset = (STATE.starOffset * l.speed) % H;
      child.style.transform = `translateY(${offset}px)`;
    }
  });

  // --- Ship ---
  STATE.ship.update(dt);

  // --- Weapon recharge ---
  if (STATE.weaponRecharging) {
    STATE.weaponTimer += dt * 1000;
    STATE.weaponCharge = clamp(STATE.weaponTimer / STATE.weaponCooldown, 0, 1);
    if (STATE.weaponCharge >= 1.0) STATE.weaponRecharging = false;
  }

  // --- Hyper recharge ---
  if (!STATE.hyperReady) {
    STATE.hyperTimer -= dt * 1000;
    if (STATE.hyperTimer <= 0) {
      STATE.hyperReady = true;
      STATE.hyperCharges = STATE.hyperMax;
    }
  }

  // --- Invincibility ---
  if (STATE.invincible) {
    STATE.invincibleTimer -= dt * 1000;
    if (STATE.invincibleTimer <= 0) {
      STATE.invincible = false;
      STATE.ship.el.style.animation = '';
    }
  }

  // --- Spawn asteroids ---
  STATE.spawnTimer += dt * 1000;
  if (STATE.spawnTimer >= STATE.spawnInterval) {
    STATE.spawnTimer = 0;
    const count = STATE.level > 5 ? 2 : 1;
    for (let i = 0; i < count; i++) spawnAsteroid();
  }

  // --- Update lasers ---
  for (let i = STATE.lasers.length - 1; i >= 0; i--) {
    const laser = STATE.lasers[i];
    laser.update(dt);
    if (laser.dead) {
      laser.destroy();
      STATE.lasers.splice(i, 1);
    }
  }

  // --- Update asteroids ---
  for (let i = STATE.asteroids.length - 1; i >= 0; i--) {
    const ast = STATE.asteroids[i];
    ast.update(dt);
    if (ast.dead) {
      STATE.asteroids.splice(i, 1);
      continue;
    }

    // Laser vs asteroid collision
    let hitByLaser = false;
    for (let j = STATE.lasers.length - 1; j >= 0; j--) {
      const laser = STATE.lasers[j];
      if (circleCollide(laser.x, laser.y, 4, ast.x, ast.y, ast.r * 0.85)) {
        laser.dead = true;
        laser.destroy();
        STATE.lasers.splice(j, 1);
        hitByLaser = true;
        break;
      }
    }
    if (hitByLaser) {
      explodeAsteroid(ast, true);
      STATE.asteroids.splice(i, 1);
      continue;
    }

    // Ship vs asteroid collision
    if (circleCollide(STATE.ship.x, STATE.ship.y, 14, ast.x, ast.y, ast.r * 0.8)) {
      shipHit();
    }
  }

  // --- Update fragments ---
  for (let i = STATE.fragments.length - 1; i >= 0; i--) {
    const frag = STATE.fragments[i];
    frag.update(dt);
    if (frag.dead) {
      frag.destroy();
      STATE.fragments.splice(i, 1);
      continue;
    }

    // Ship vs fragment
    if (circleCollide(STATE.ship.x, STATE.ship.y, 12, frag.x, frag.y, frag.r)) {
      shipHit();
    }

    // Laser vs fragment
    for (let j = STATE.lasers.length - 1; j >= 0; j--) {
      const laser = STATE.lasers[j];
      if (circleCollide(laser.x, laser.y, 4, frag.x, frag.y, frag.r)) {
        laser.dead = true;
        laser.destroy();
        STATE.lasers.splice(j, 1);
        STATE.score += 15;
        frag.dead = true;
        frag.destroy();
        STATE.fragments.splice(i, 1);
        break;
      }
    }
  }

  // --- Update particles ---
  for (let i = STATE.particles.length - 1; i >= 0; i--) {
    STATE.particles[i].update(dt);
    if (STATE.particles[i].dead) {
      STATE.particles[i].destroy();
      STATE.particles.splice(i, 1);
    }
  }

  // --- Flash timers ---
  if (STATE.flashTimer > 0) {
    STATE.flashTimer -= dt;
    if (STATE.flashTimer <= 0) $('score-flash').style.opacity = '0';
  }
  if (STATE.levelUpTimer > 0) {
    STATE.levelUpTimer -= dt;
    if (STATE.levelUpTimer <= 0) $('level-badge').style.opacity = '0';
  }

  // --- HUD ---
  updateHUD();
}

// ----------------------------------------------------------------
// GAME OVER
// ----------------------------------------------------------------
function gameOver() {
  STATE.running = false;
  $('final-score-display').textContent = String(STATE.score).padStart(6, '0');
  $('final-level-display').textContent = 'Nivel alcanzado: ' + STATE.level;
  $('gameover-screen').style.display = 'flex';
}

// ----------------------------------------------------------------
// CLEANUP  (remove all game entities from DOM)
// ----------------------------------------------------------------
function cleanupEntities() {
  [...STATE.lasers, ...STATE.asteroids, ...STATE.fragments, ...STATE.particles].forEach(e => e.destroy());
  STATE.lasers = [];
  STATE.asteroids = [];
  STATE.fragments = [];
  STATE.particles = [];
}

// ----------------------------------------------------------------
// START GAME
// ----------------------------------------------------------------
function startGame() {
  $('start-screen').style.display = 'none';
  $('gameover-screen').style.display = 'none';

  cleanupEntities();

  // Reset state
  STATE.running = false;
  STATE.paused = false;
  STATE.score = 0;
  STATE.level = 1;
  STATE.lives = 3;
  STATE.spawnTimer = 0;
  STATE.spawnInterval = 2200;
  STATE.weaponCharge = 1.0;
  STATE.weaponRecharging = false;
  STATE.weaponTimer = 0;
  STATE.hyperCharges = STATE.hyperMax;
  STATE.hyperReady = true;
  STATE.hyperTimer = 0;
  STATE.invincible = false;
  STATE.invincibleTimer = 0;
  STATE.flashTimer = 0;
  STATE.levelUpTimer = 0;

  // Remove stale pause overlay if any
  const po = document.getElementById('pause-overlay');
  if (po) po.remove();

  // Re-init ship
  STATE.ship = new Ship();
  STATE.ship.el.style.animation = '';

  // Seed initial asteroids
  for (let i = 0; i < 4; i++) spawnAsteroid();

  updateHUD();
  STATE.running = true;
  STATE.lastFrame = performance.now();
  requestAnimationFrame(gameLoop);
}

// ----------------------------------------------------------------
// BUTTON HANDLERS
// ----------------------------------------------------------------
$('start-btn').addEventListener('click', startGame);
$('restart-btn').addEventListener('click', startGame);

// Also allow Enter key on screens
window.addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    if ($('start-screen').style.display !== 'none') startGame();
    else if ($('gameover-screen').style.display !== 'none') startGame();
  }
});
</script>
