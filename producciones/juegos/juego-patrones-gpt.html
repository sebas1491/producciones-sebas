<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Juego de Patrones</title>
<style>
    body {
        font-family: Arial, sans-serif;
        text-align: center;
        background: linear-gradient(135deg, #ff9a9e, #fad0c4);
        margin: 0;
    }
    h1 { color: white; }

    #game {
        margin-top: 20px;
    }

    .row {
        display: flex;
        justify-content: center;
        gap: 15px;
        margin: 20px;
    }

    .shape {
        width: 60px;
        height: 60px;
    }

    .circle {
        background: #ff4d4d;
        border-radius: 50%;
    }

    .square {
        background: #4da6ff;
    }

    .triangle {
        width: 0;
        height: 0;
        border-left: 30px solid transparent;
        border-right: 30px solid transparent;
        border-bottom: 60px solid #4dff88;
        background: none;
    }

    .rectangle {
        width: 80px;
        height: 50px;
        background: #ffd24d;
    }

    .missing {
        background: #ccc;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: bold;
    }

    .options {
        display: flex;
        justify-content: center;
        gap: 20px;
    }

    button {
        padding: 10px 20px;
        font-size: 16px;
        border: none;
        border-radius: 10px;
        background: #333;
        color: white;
        cursor: pointer;
    }

    button:hover {
        background: #555;
    }

    #timer {
        font-size: 20px;
        color: white;
    }
</style>
</head>
<body>

<h1>🧠 Juego de Patrones</h1>
<div id="timer"></div>

<button onclick="startGame()">Comenzar</button>

<div id="game"></div>
<div id="options" class="options"></div>

<script>
const shapes = ["circle", "square", "triangle", "rectangle"];

let level = 0;
let timer;
let timeLeft = 30;
let correctAnswer;

function startGame() {
    level = 1;
    nextLevel();
}

function nextLevel() {
    document.getElementById("options").innerHTML = "";
    if (level > 6) {
        document.getElementById("game").innerHTML = "<h2>🎉 GANASTE 🎉</h2><button onclick='startGame()'>Jugar otra vez</button>";
        return;
    }

    timeLeft = 30;
    updateTimer();
    clearInterval(timer);
    timer = setInterval(() => {
        timeLeft--;
        updateTimer();
        if (timeLeft <= 0) lose();
    }, 1000);

    generatePattern(level);
}

function updateTimer() {
    document.getElementById("timer").innerText = "Tiempo: " + timeLeft + "s";
}

function generatePattern(level) {
    const game = document.getElementById("game");
    game.innerHTML = "";

    let pattern = [];

    // dificultad progresiva
    let length = 3 + level;

    for (let i = 0; i < length; i++) {
        pattern.push(shapes[i % shapes.length]);
    }

    // ocultar uno
    let missingIndex = Math.floor(Math.random() * pattern.length);
    correctAnswer = pattern[missingIndex];

    const row = document.createElement("div");
    row.className = "row";

    pattern.forEach((shape, i) => {
        const div = document.createElement("div");
        div.className = "shape";

        if (i === missingIndex) {
            div.classList.add("missing");
            div.innerText = "?";
        } else {
            div.classList.add(shape);
        }

        row.appendChild(div);
    });

    game.appendChild(row);

    generateOptions();
}

function generateOptions() {
    const optionsDiv = document.getElementById("options");
    optionsDiv.innerHTML = "";

    let options = [...shapes].sort(() => Math.random() - 0.5);

    options.forEach(shape => {
        const btn = document.createElement("button");
        btn.innerText = shape;
        btn.onclick = () => checkAnswer(shape);
        optionsDiv.appendChild(btn);
    });
}

function checkAnswer(answer) {
    if (answer === correctAnswer) {
        level++;
        nextLevel();
    } else {
        lose();
    }
}

function lose() {
    clearInterval(timer);
    document.getElementById("game").innerHTML = "<h2>❌ PERDISTE ❌</h2><button onclick='startGame()'>Reintentar</button>";
    document.getElementById("options").innerHTML = "";
}
</script>

</body>
</html>
