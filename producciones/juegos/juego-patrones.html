<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patrón Maestro - Juego de Memoria</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&family=Quicksand:wght@400;700&display=swap');

        body {
            font-family: 'Quicksand', sans-serif;
            background: linear-gradient(135deg, #f6d365 0%, #fda085 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            overflow-x: hidden;
        }

        .title-font {
            font-family: 'Fredoka One', cursive;
        }

        .game-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 2rem;
            box-shadow: 0 20px 50px rgba(0,0,0,0.15);
            transition: all 0.3s ease;
        }

        .shape {
            transition: transform 0.2s, filter 0.2s;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .shape:hover {
            transform: scale(1.1);
            filter: brightness(1.1);
        }

        .shape:active {
            transform: scale(0.95);
        }

        .shape-slot {
            border: 3px dashed #cbd5e0;
            border-radius: 1rem;
            background: #edf2f7;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
        }

        .shape-slot.correct {
            border-color: #48bb78;
            background: #f0fff4;
        }

        .btn-bounce {
            transition: transform 0.2s;
        }

        .btn-bounce:hover {
            transform: scale(1.05);
        }

        /* Definición de formas con SVG inline o CSS puro */
        .circle { border-radius: 50%; background-color: #FF595E; width: 60px; height: 60px; }
        .square { border-radius: 8px; background-color: #1982C4; width: 60px; height: 60px; }
        .triangle { 
            width: 0; height: 0; 
            border-left: 30px solid transparent; 
            border-right: 30px solid transparent; 
            border-bottom: 60px solid #8AC926; 
            background-color: transparent !important;
        }
        .rectangle { border-radius: 8px; background-color: #FFCA3A; width: 80px; height: 50px; }

        .option-shape {
            width: 50px;
            height: 50px;
        }
        .triangle-opt {
            border-left: 25px solid transparent;
            border-right: 25px solid transparent;
            border-bottom: 50px solid #8AC926;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        .shake { animation: shake 0.3s ease-in-out; }
    </style>
</head>
<body>

    <div id="app" class="w-full max-w-2xl p-4">
        <!-- Pantalla de Inicio -->
        <div id="start-screen" class="game-card p-8 text-center">
            <h1 class="title-font text-5xl text-orange-500 mb-6">Patrón Maestro</h1>
            <p class="text-xl text-gray-600 mb-8">Completa las secuencias lógicas antes de que se agote el tiempo. ¡6 niveles de pura diversión!</p>
            <button onclick="startGame()" class="btn-bounce bg-orange-500 hover:bg-orange-600 text-white title-font text-2xl py-4 px-12 rounded-full shadow-lg transition">
                ¡COMENZAR!
            </button>
        </div>

        <!-- Pantalla de Juego -->
        <div id="game-screen" class="game-card p-6 hidden">
            <div class="flex justify-between items-center mb-6">
                <div>
                    <span class="text-gray-500 font-bold uppercase tracking-wider">Nivel</span>
                    <div id="level-indicator" class="text-3xl title-font text-blue-600">1 / 6</div>
                </div>
                <div class="text-center">
                    <span class="text-gray-500 font-bold uppercase tracking-wider">Tiempo</span>
                    <div id="timer" class="text-3xl title-font text-red-500">30s</div>
                </div>
            </div>

            <div class="bg-gray-100 p-8 rounded-3xl mb-8">
                <p class="text-center text-gray-500 mb-4 font-bold">¿Qué figura sigue?</p>
                <div id="pattern-container" class="flex flex-wrap justify-center items-center gap-4 min-h-[100px]">
                    <!-- Aquí se generan las figuras del patrón -->
                </div>
            </div>

            <div class="text-center">
                <p class="text-gray-600 mb-4 font-bold">Elige la respuesta correcta:</p>
                <div id="options-container" class="flex justify-center gap-6">
                    <!-- Aquí se generan las opciones -->
                </div>
            </div>
        </div>

        <!-- Pantalla de Resultado (Perdiste/Ganaste) -->
        <div id="result-screen" class="game-card p-10 text-center hidden">
            <h2 id="result-title" class="title-font text-6xl mb-6"></h2>
            <p id="result-message" class="text-xl text-gray-600 mb-8"></p>
            <div id="result-buttons">
                <button onclick="resetGame()" class="btn-bounce bg-blue-500 hover:bg-blue-600 text-white title-font text-2xl py-4 px-10 rounded-full shadow-lg">
                    VOLVER A COMENZAR
                </button>
            </div>
        </div>
    </div>

    <script>
        // Configuración del Juego
        const SHAPES = [
            { type: 'circle', color: '#FF595E' },
            { type: 'square', color: '#1982C4' },
            { type: 'triangle', color: '#8AC926' },
            { type: 'rectangle', color: '#FFCA3A' }
        ];

        let currentLevel = 1;
        const maxLevels = 6;
        let timeLeft = 30;
        let timerId = null;
        let correctShape = null;

        // Definición de patrones por nivel
        const levels = [
            { // Nivel 1: A-B-A-B
                pattern: [0, 1, 0, 1, 0],
                answer: 1
            },
            { // Nivel 2: A-A-B-B
                pattern: [2, 2, 3, 3, 2],
                answer: 2
            },
            { // Nivel 3: A-B-C-A-B
                pattern: [0, 1, 2, 0, 1],
                answer: 2
            },
            { // Nivel 4: A-B-B-A-B
                pattern: [1, 3, 3, 1, 3],
                answer: 3
            },
            { // Nivel 5: Escalera o Secuencia Compleja (Círculo, Cuadrado, Triángulo, Rectángulo...)
                pattern: [0, 1, 2, 3, 0, 1],
                answer: 2
            },
            { // Nivel 6: Patrón Inverso
                pattern: [2, 0, 3, 2, 0],
                answer: 3
            }
        ];

        function startGame() {
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('result-screen').classList.add('hidden');
            document.getElementById('game-screen').classList.remove('hidden');
            currentLevel = 1;
            loadLevel();
        }

        function loadLevel() {
            clearInterval(timerId);
            timeLeft = 30;
            updateTimerDisplay();
            
            document.getElementById('level-indicator').innerText = `${currentLevel} / ${maxLevels}`;
            
            const levelData = levels[currentLevel - 1];
            const patternContainer = document.getElementById('pattern-container');
            const optionsContainer = document.getElementById('options-container');
            
            patternContainer.innerHTML = '';
            optionsContainer.innerHTML = '';
            
            // Crear el patrón visual
            levelData.pattern.forEach(shapeIndex => {
                const shapeEl = createShapeElement(SHAPES[shapeIndex].type);
                patternContainer.appendChild(shapeEl);
            });

            // Añadir el "hueco" de la incógnita
            const slot = document.createElement('div');
            slot.className = 'shape-slot w-[70px] h-[70px] text-2xl font-bold text-gray-400';
            slot.innerText = '?';
            slot.id = 'target-slot';
            patternContainer.appendChild(slot);

            correctShape = SHAPES[levelData.answer].type;

            // Crear opciones (barajadas)
            const shuffledShapes = [...SHAPES].sort(() => Math.random() - 0.5);
            shuffledShapes.forEach(shape => {
                const optBtn = document.createElement('div');
                optBtn.className = 'shape shadow-md p-2 bg-white rounded-xl';
                optBtn.onclick = () => checkAnswer(shape.type);
                
                const visual = createShapeElement(shape.type, true);
                optBtn.appendChild(visual);
                optionsContainer.appendChild(optBtn);
            });

            startTimer();
        }

        function createShapeElement(type, isOption = false) {
            const div = document.createElement('div');
            if (type === 'triangle') {
                div.className = isOption ? 'triangle-opt' : 'triangle';
            } else {
                div.className = `${type} ${isOption ? 'option-shape' : ''}`;
            }
            return div;
        }

        function startTimer() {
            timerId = setInterval(() => {
                timeLeft--;
                updateTimerDisplay();
                if (timeLeft <= 0) {
                    gameOver(false);
                }
            }, 1000);
        }

        function updateTimerDisplay() {
            const timerEl = document.getElementById('timer');
            timerEl.innerText = `${timeLeft}s`;
            if (timeLeft <= 10) {
                timerEl.classList.add('scale-110');
                timerEl.style.color = '#e53e3e';
            } else {
                timerEl.classList.remove('scale-110');
                timerEl.style.color = '#f56565';
            }
        }

        function checkAnswer(selectedType) {
            if (selectedType === correctShape) {
                const slot = document.getElementById('target-slot');
                slot.innerHTML = '';
                slot.classList.add('correct');
                slot.appendChild(createShapeElement(selectedType));
                
                clearInterval(timerId);
                
                setTimeout(() => {
                    if (currentLevel < maxLevels) {
                        currentLevel++;
                        loadLevel();
                    } else {
                        gameOver(true);
                    }
                }, 600);
            } else {
                const container = document.getElementById('game-screen');
                container.classList.add('shake');
                setTimeout(() => container.classList.remove('shake'), 300);
                // Opcional: reducir tiempo por error
                timeLeft = Math.max(0, timeLeft - 5);
                updateTimerDisplay();
            }
        }

        function gameOver(isWin) {
            clearInterval(timerId);
            document.getElementById('game-screen').classList.add('hidden');
            const screen = document.getElementById('result-screen');
            const title = document.getElementById('result-title');
            const msg = document.getElementById('result-message');
            
            screen.classList.remove('hidden');
            
            if (isWin) {
                title.innerText = "¡GANASTE!";
                title.className = "title-font text-6xl mb-6 text-green-500";
                msg.innerText = "¡Eres un genio de la lógica! Has completado todos los niveles.";
            } else {
                title.innerText = "¡PERDISTE!";
                title.className = "title-font text-6xl mb-6 text-red-500";
                msg.innerText = "Se acabó el tiempo o cometiste demasiados errores. ¡Inténtalo de nuevo!";
            }
        }

        function resetGame() {
            startGame();
        }
    </script>
</body>
</html>
