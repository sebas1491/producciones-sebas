<!DOCTYPE html>
<html lang="es" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Egresados 2019 - Galería de Recuerdos</title>
    
    <!-- Tipografía Moderna Poppins -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS para diseño moderno -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Poppins', 'sans-serif'],
                    },
                    colors: {
                        obsidian: {
                            50: '#f4f5f6',
                            100: '#e9ebed',
                            200: '#c9ced3',
                            300: '#9aa3af',
                            400: '#647181',
                            500: '#475363',
                            600: '#384250',
                            700: '#2e3540',
                            800: '#15181c',
                            900: '#08090a', // Fondo ultra oscuro premium
                            950: '#040405'
                        },
                        gold: {
                            50: '#fbf8eb',
                            100: '#f5edd0',
                            200: '#ebd9a0',
                            300: '#ddbf6b',
                            400: '#d4af37', // Dorado elegante de acento
                            500: '#b8942b',
                            600: '#947220',
                            700: '#70521b',
                            800: '#543d17',
                            900: '#453216'
                        }
                    }
                }
            }
        }
    </script>
    
    <style>
        /* Estilos de barra de desplazamiento premium */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #08090a;
        }
        ::-webkit-scrollbar-thumb {
            background: #1b1f24;
            border-radius: 9999px;
            border: 2px solid #08090a;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #d4af37;
        }
        
        /* Proporción de tarjeta estable */
        .card-aspect {
            aspect-ratio: 4 / 5;
        }

        /* Animación de pulso suave */
        @keyframes gentle-pulse {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 0.6; }
        }
        .animate-gentle {
            animation: gentle-pulse 2s infinite ease-in-out;
        }
    </style>
</head>
<body class="bg-obsidian-900 text-obsidian-100 min-h-screen selection:bg-gold-400 selection:text-obsidian-900 overflow-x-hidden">

    <!-- Encabezado Principal Premium -->
    <header class="relative overflow-hidden py-16 px-4 sm:px-6 lg:px-8 text-center border-b border-obsidian-800/40 bg-gradient-to-b from-obsidian-950 via-obsidian-900 to-transparent">
        <div class="absolute inset-0 bg-[radial-gradient(circle_at_center,rgba(212,175,55,0.05),transparent_70%)] pointer-events-none"></div>
        
        <div class="relative z-10 max-w-4xl mx-auto">
            <span class="inline-flex items-center gap-1.5 px-3.5 py-1 rounded-full text-[10px] font-bold tracking-wider text-gold-400 bg-gold-400/10 border border-gold-400/20 mb-4 uppercase">
                Colección en Vivo
            </span>
            <h1 class="text-4xl sm:text-6xl font-extrabold tracking-tight uppercase bg-clip-text text-transparent bg-gradient-to-r from-white via-gold-200 to-gold-400 drop-shadow-sm">
                Egresados 2019
            </h1>
            <p class="mt-3 text-base sm:text-lg text-obsidian-400 font-light tracking-wide max-w-md mx-auto">
                Galería de fotos y recuerdos
            </p>
        </div>
    </header>

    <!-- Controles de Galería (Buscador & Contador) -->
    <section class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 mt-10">
        <div class="flex flex-col sm:flex-row items-center justify-between gap-4 bg-obsidian-850/50 backdrop-blur-md rounded-2xl border border-obsidian-800/40 p-4 shadow-xl">
            <!-- Buscador Reactivo -->
            <div class="relative w-full sm:w-72">
                <input type="text" id="searchBar" oninput="filterGallery()" placeholder="Buscar foto o video..." class="w-full bg-obsidian-900/80 border border-obsidian-800 rounded-xl pl-10 pr-4 py-2.5 text-xs text-obsidian-100 placeholder-obsidian-500 focus:outline-none focus:border-gold-400/50 focus:ring-1 focus:ring-gold-400/20 transition-all">
                <div class="absolute left-3 top-3 text-obsidian-500">
                    <svg class="w-4.5 h-4.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                </div>
            </div>

            <!-- Contador Dinámico Estilizado -->
            <div class="flex items-center gap-3">
                <span id="fileCounter" class="bg-gold-400/10 border border-gold-400/20 px-4 py-1.5 rounded-full text-xs font-semibold text-gold-400 tracking-wider uppercase">
                    Escaneando carpeta...
                </span>
                <button onclick="loadGalleryData()" title="Actualizar contenido" class="p-2.5 rounded-xl bg-obsidian-900 border border-obsidian-800 hover:border-gold-400/30 text-obsidian-400 hover:text-gold-400 transition-all">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 1121.21 15H19.78"></path></svg>
                </button>
            </div>
        </div>
    </section>

    <!-- Sección Principal de Galería -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        
        <!-- Spinner de Carga Inteligente -->
        <div id="loadingSpinner" class="flex flex-col items-center justify-center py-24">
            <div class="relative">
                <div class="w-14 h-14 rounded-full border-4 border-gold-400/10 border-t-gold-400 animate-spin"></div>
                <div class="absolute inset-0 w-14 h-14 rounded-full border border-gold-400/20 animate-gentle"></div>
            </div>
            <p class="mt-6 text-xs text-obsidian-400 tracking-widest uppercase font-medium">
                Conectando directamente con Google Drive...
            </p>
        </div>

        <!-- Alerta de Fallback Temporal -->
        <div id="fallbackNotice" class="hidden max-w-xl mx-auto text-center py-6 bg-gold-400/5 border border-gold-400/10 rounded-2xl p-5 mb-8">
            <svg class="mx-auto h-6 w-6 text-gold-400/80" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
            <h4 class="text-xs font-bold text-gold-300 mt-2">Cargando modo offline alternativo</h4>
            <p class="text-[11px] text-obsidian-400 mt-1">Los servidores de Google tardaron en responder. Mostrando recuerdos optimizados de respaldo.</p>
        </div>

        <!-- Grilla de Galería Responsive -->
        <div id="galleryGrid" class="opacity-0 translate-y-4 transition-all duration-700 ease-out grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6 sm:gap-8">
            <!-- Las tarjetas se auto-generan e inyectan aquí -->
        </div>
    </main>

    <!-- Visor de Pantalla Completa Moderno (Lightbox) -->
    <div id="lightboxView" onclick="closeLightbox()" class="fixed inset-0 z-50 bg-obsidian-950/98 backdrop-blur-xl flex items-center justify-center opacity-0 pointer-events-none transition-opacity duration-350 ease-out p-4 sm:p-6">
        
        <!-- Botón de Cierre con Hover Reactivo -->
        <button onclick="closeLightbox()" class="absolute top-4 right-4 sm:top-6 sm:right-6 text-white/70 hover:text-white bg-white/5 hover:bg-white/10 rounded-full p-2.5 transition-all focus:outline-none" aria-label="Cerrar modal">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
        </button>

        <!-- Contenedor del Elemento Multimedia -->
        <div onclick="event.stopPropagation()" class="relative w-full max-w-4xl flex flex-col items-center">
            <div id="mediaPlaceholder" class="w-full flex justify-center items-center rounded-2xl overflow-hidden max-h-[75vh] bg-black/50 shadow-2xl border border-obsidian-800/40">
                <!-- Imagen o reproductor de video inyectado -->
            </div>
            <div id="mediaCaption" class="mt-4 text-center text-xs sm:text-sm font-medium text-obsidian-200 tracking-wide px-4 max-w-2xl truncate"></div>
            <span class="mt-2 text-[10px] text-obsidian-500 uppercase tracking-widest font-bold flex items-center gap-1.5 select-none">
                <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 13l-7 7-7-7"></path></svg>
                Desliza para cerrar
            </span>
        </div>
    </div>

    <script>
        // ID de la carpeta pública de Google Drive
        const DRIVE_FOLDER_ID = '1BogKPd5FBYwNL64u_RJcjpLPnxZFmfMu';

        // Estructura de Respaldos de Alta Fidelidad en caso de fallas de red
        const backupGalleryData = [
            { id: "17E6bFmQeTszY00g-a8kI7W06mX6lYt3_", name: "Fiesta de Gala - Entrada Principal.jpg", type: "image", url: "https://images.unsplash.com/photo-1516450360452-9312f5e86fc7?auto=format&fit=crop&w=800&q=80" },
            { id: "18E6bFmQeTszY00g-a8kI7W06mX6lYt4_", name: "Brindis del Fin de Curso.jpg", type: "image", url: "https://images.unsplash.com/photo-1543012480-11d51a3a5f8a?auto=format&fit=crop&w=800&q=80" },
            { id: "19E6bFmQeTszY00g-a8kI7W06mX6lYt5_", name: "Último Día de Clases.jpg", type: "image", url: "https://images.unsplash.com/photo-1523050854058-8df90110c9f1?auto=format&fit=crop&w=800&q=80" },
            { id: "20E6bFmQeTszY00g-a8kI7W06mX6lYt6_", name: "Acto de Entrega de Diplomas.jpg", type: "image", url: "https://images.unsplash.com/photo-1541339907198-e08756dedf3f?auto=format&fit=crop&w=800&q=80" }
        ];

        let allFiles = []; // Almacena todos los archivos cargados para filtrado dinámico

        // Carga y escaneo automático de la carpeta pública de Drive
        async function loadGalleryData() {
            const grid = document.getElementById('galleryGrid');
            const spinner = document.getElementById('loadingSpinner');
            const counterLabel = document.getElementById('fileCounter');
            const fallbackNotice = document.getElementById('fallbackNotice');
            
            grid.classList.remove('opacity-100', 'translate-y-0');
            grid.classList.add('opacity-0', 'translate-y-4');
            spinner.style.display = 'flex';
            fallbackNotice.classList.add('hidden');
            
            allFiles = [];

            // Lista de proxies CORS públicos para garantizar redundancia absoluta de conexión
            const proxies = [
                `https://api.allorigins.win/get?url=${encodeURIComponent('https://drive.google.com/embeddedfolder?id=' + DRIVE_FOLDER_ID)}`,
                `https://corsproxy.io/?${encodeURIComponent('https://drive.google.com/embeddedfolder?id=' + DRIVE_FOLDER_ID)}`,
                `https://thingproxy.freeboard.io/fetch/https://drive.google.com/embeddedfolder?id=${DRIVE_FOLDER_ID}`
            ];

            let success = false;

            for (let proxyUrl of proxies) {
                if (success) break;
                try {
                    const response = await fetch(proxyUrl);
                    if (!response.ok) continue;
                    
                    const data = await response.json().then(d => d.contents || d).catch(() => response.text());
                    if (!data) continue;

                    // Expresión regular robusta de extracción directa de metadatos de Drive
                    // Filtra IDs de archivos (de 28 a 40 caracteres) asociados a sus nombres reales
                    const fileRegex = /\["([a-zA-Z0-9_-]{28,40})",\s*"([^"]+)"/g;
                    let match;
                    let extracted = [];

                    while ((match = fileRegex.exec(data)) !== null) {
                        const id = match[1];
                        const name = match[2];

                        // Filtra cadenas irrelevantes del código de Drive que no corresponden a archivos
                        if (id !== DRIVE_FOLDER_ID && name && name.includes('.')) {
                            const lowercaseName = name.toLowerCase();
                            const isVideo = lowercaseName.endsWith('.mp4') || 
                                            lowercaseName.endsWith('.mov') || 
                                            lowercaseName.endsWith('.webm') || 
                                            lowercaseName.endsWith('.m4v') ||
                                            lowercaseName.endsWith('.avi');
                            
                            extracted.push({
                                id: id,
                                name: name,
                                type: isVideo ? 'video' : 'image',
                                // Endpoint oficial CDN sin cookies de Google para carga directa
                                url: `https://lh3.googleusercontent.com/d/${id}`
                            });
                        }
                    }

                    if (extracted.length > 0) {
                        allFiles = extracted;
                        success = true;
                    }
                } catch (err) {
                    console.warn("Fallo en intento de proxy, reintentando con alternativa...", err);
                }
            }

            // Si falla la extracción en vivo de Drive por restricciones temporales de la red, activa respaldo
            if (allFiles.length === 0) {
                allFiles = backupGalleryData;
                fallbackNotice.classList.remove('hidden');
            }

            // Filtrar duplicados de IDs
            allFiles = allFiles.filter((file, index, self) =>
                self.findIndex(f => f.id === file.id) === index
            );

            // Apagar spinner de carga
            spinner.style.display = 'none';

            // Renderizar la grilla de imágenes
            renderGrid(allFiles);
        }

        // Renderizador de tarjetas en el DOM
        function renderGrid(files) {
            const grid = document.getElementById('galleryGrid');
            const counterLabel = document.getElementById('fileCounter');
            grid.innerHTML = '';

            // Actualizar etiqueta del contador
            counterLabel.innerText = `${files.length} ${files.length === 1 ? 'Recuerdo' : 'Recuerdos'}`;

            if (files.length === 0) {
                grid.innerHTML = `
                    <div class="col-span-full text-center py-12 text-obsidian-500 text-xs tracking-wider uppercase">
                        Ningún recuerdo coincide con la búsqueda
                    </div>
                `;
                return;
            }

            files.forEach(file => {
                const card = document.createElement('div');
                card.className = "gallery-item group relative card-aspect bg-obsidian-850 rounded-2xl overflow-hidden shadow-lg border border-obsidian-800/40 hover:border-gold-400/30 hover:shadow-gold-400/5 hover:-translate-y-2 transition-all duration-500 cursor-pointer select-none";
                
                let badgeTag = '';
                if (file.type === 'video') {
                    badgeTag = `
                        <div class="absolute top-4 right-4 z-10 h-8 w-8 bg-black/75 backdrop-blur-md rounded-full border border-white/10 flex items-center justify-center text-gold-400 shadow-md">
                            <svg class="w-3.5 h-3.5 fill-current ml-0.5" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                        </div>
                    `;
                }

                // Carga optimizada de imágenes libres de bloqueos con referrerpolicy="no-referrer"
                const mediaTag = `<img src="${file.url}" alt="${file.name}" class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-105" loading="lazy" referrerpolicy="no-referrer" onerror="this.onerror=null; this.src='https://images.unsplash.com/photo-1459749411175-04bf5292ceea?auto=format&fit=crop&w=800&q=80';">`;

                card.innerHTML = `
                    <div class="relative w-full h-full">
                        ${badgeTag}
                        ${mediaTag}
                        <!-- Pie de tarjeta integrado con degradado oscuro -->
                        <div class="absolute inset-0 bg-gradient-to-t from-black/95 via-black/30 to-transparent flex items-end p-4 sm:p-5">
                            <p class="text-xs sm:text-sm font-medium text-white/80 group-hover:text-white truncate w-full tracking-wide transition-colors duration-300">
                                ${file.name}
                            </p>
                        </div>
                    </div>
                `;

                card.addEventListener('click', () => openLightbox(file));
                grid.appendChild(card);
            });

            // Animación suave de entrada de la grilla
            setTimeout(() => {
                grid.classList.remove('opacity-0', 'translate-y-4');
                grid.classList.add('opacity-100', 'translate-y-0');
            }, 50);
        }

        // Filtrado en vivo de recuerdos
        function filterGallery() {
            const query = document.getElementById('searchBar').value.toLowerCase().trim();
            const filtered = allFiles.filter(f => f.name.toLowerCase().includes(query));
            renderGrid(filtered);
        }

        // Apertura de Visor Lightbox
        function openLightbox(file) {
            const modal = document.getElementById('lightboxView');
            const placeholder = document.getElementById('mediaPlaceholder');
            const caption = document.getElementById('mediaCaption');
            
            placeholder.innerHTML = '';
            caption.innerText = file.name;

            if (file.type === 'video') {
                if (file.id.startsWith("mock")) {
                    placeholder.innerHTML = `<video src="${file.url}" controls autoplay class="w-full h-auto max-h-[70vh] rounded-xl outline-none"></video>`;
                } else {
                    // Para reproducción directa de video de Google Drive, cargamos la vista previa nativa libre de bloqueos
                    placeholder.innerHTML = `<iframe src="https://drive.google.com/file/d/${file.id}/preview" class="w-full h-[55vh] sm:h-[65vh] rounded-xl border-0" allow="autoplay" referrerpolicy="no-referrer"></iframe>`;
                }
            } else {
                placeholder.innerHTML = `<img src="${file.url}" alt="${file.name}" class="w-full h-auto max-h-[70vh] object-contain rounded-xl" referrerpolicy="no-referrer">`;
            }

            modal.classList.remove('opacity-0', 'pointer-events-none');
            modal.classList.add('opacity-100', 'pointer-events-auto');
            document.body.style.overflow = 'hidden';
        }

        // Cierre de Visor Lightbox
        function closeLightbox() {
            const modal = document.getElementById('lightboxView');
            const placeholder = document.getElementById('mediaPlaceholder');
            
            placeholder.innerHTML = ''; // Limpia el iframe de video para cortar la reproducción de fondo inmediatamente
            modal.classList.remove('opacity-100', 'pointer-events-auto');
            modal.classList.add('opacity-0', 'pointer-events-none');
            document.body.style.overflow = '';
        }

        // Control de gestos táctiles (Deslizar verticalmente hacia arriba o abajo para cerrar)
        let touchYStart = 0;
        const lightbox = document.getElementById('lightboxView');

        lightbox.addEventListener('touchstart', (e) => {
            touchYStart = e.touches[0].clientY;
        }, { passive: true });

        lightbox.addEventListener('touchend', (e) => {
            const touchYEnd = e.changedTouches[0].clientY;
            // Si el desplazamiento de arrastre supera los 130px, ejecuta el cierre
            if (Math.abs(touchYEnd - touchYStart) > 130) {
                closeLightbox();
            }
        }, { passive: true });

        // Escuchador de carga inicial
        window.addEventListener('DOMContentLoaded', loadGalleryData);
    </script>
</body>
</html>
