<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juego de Patrones Mágicos</title>
    <style>
        :root {
            --primary: #ff6b6b;
            --secondary: #4ecdc4;
            --accent: #ffe66d;
            --bg: #f7fff7;
            --circle-clr: #ff9f43;
            --square-clr: #54a0ff;
            --rect-clr: #5f27cd;
            --text: #2d3436;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Comic Sans MS', 'Chalkboard SE', 'Arial Rounded MT Bold', sans-serif;
        }

        body {
            background-color: var(--bg);
            background-image: radial-gradient(#dff9fb 2px, transparent 2px);
            background-size: 30px 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            color: var(--text);
            padding: 20px;
        }

        .container {
            text-align: center;
            background: white;
            padding: 30px;
            border-radius: 30px;
            box-shadow: 0 10px 0 rgba(0,0,0,0.05);
            max-width: 700px;
            width: 100%;
        }

        h1 {
            color: var(--primary);
            font-size: 2.2rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 0px #eee;
        }

        .difficulty-menu {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }

        .diff-btn {
            padding: 15px;
            border: none;
            border-radius: 20px;
            font-size: 1.2rem;
            font-weight: bold;
            color: white;
            cursor: pointer;
            transition: transform 0.2s;
            box-shadow: 0 5px 0 rgba(0,0,0,0.1);
        }

        .diff-btn:hover { transform: translateY(-3px); }
        .diff-btn:active { transform: translateY(2px); }

        .diff-easy { background: #2ecc71; box-shadow: 0 5px 0 #27ae60; }
        .diff-medium { background: #f1c40f; box-shadow: 0 5px 0 #f39c12; }
        .diff-hard { background: #e67e22; box-shadow: 0 5px 0 #d35400; }

        .game-info {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            background: #f1f2f6;
            padding: 10px 20px;
            border-radius: 15px;
            font-weight: bold;
        }

        #timer.warning {
            color: var(--primary);
            animation: pulse 0.8s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        .shape {
            display: inline-block;
            transition: transform 0.2s;
        }

        .shape.circle {
            width: 50px;
            height: 50px;
            background-color: var(--circle-clr);
            border-radius: 50%;
        }

        .shape.square {
            width: 50px;
            height: 50px;
            background-color: var(--square-clr);
            border-radius: 8px;
        }

        .shape.rect {
            width: 70px;
            height: 40px;
            background-color: var(--rect-clr);
            border-radius: 8px;
        }

        .pattern-display {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            min-height: 120px;
            background: #fdfdfd;
            border: 3px dashed #dfe6e9;
            border-radius: 20px;
            margin-bottom: 25px;
            padding: 20px;
            flex-wrap: wrap;
        }

        .missing-slot {
            width: 50px;
            height: 50px;
            border: 4px dashed #bdc3c7;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            color: #bdc3c7;
        }

        .options-container {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .option-btn {
            background: white;
            border: 3px solid #f1f2f6;
            padding: 12px;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .option-btn:hover {
            transform: translateY(-5px);
            border-color: var(--secondary);
            background: #f7fff7;
        }

        .btn-main {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 1.3rem;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 5px 0 #d63031;
            transition: all 0.2s;
            font-weight: bold;
            margin-top: 15px;
        }

        .btn-main:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #d63031;
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.98);
            display: none; /* Controlado por JS */
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            text-align: center;
            padding: 20px;
        }

        .level-indicator {
            font-size: 1.2rem;
            color: #636e72;
            margin-bottom: 10px;
            font-weight: bold;
        }

        #game-screen { display: none; }
        #start-screen { display: block; }
    </style>
</head>
<body>

    <div class="container">
        <!-- Pantalla de Inicio / Menú -->
        <div id="start-screen">
            <h1>🧩 Patrones Locos</h1>
            <p style="margin-bottom: 20px; color: #636e72;">¡Elige una dificultad para empezar!</p>
            
            <div class="difficulty-menu">
                <button class="diff-btn diff-easy" onclick="initGame('easy')">FÁCIL<br><small>Nivel 1-6</small></button>
                <button class="diff-btn diff-medium" onclick="initGame('medium')">MEDIO<br><small>Nivel 7-12</small></button>
                <button class="diff-btn diff-hard" onclick="initGame('hard')">DIFÍCIL<br><small>Nivel 13-18</small></button>
            </div>
        </div>

        <!-- Pantalla de Juego -->
        <div id="game-screen">
            <div class="level-indicator" id="level-text">Nivel 1</div>
            <div class="game-info">
                <div>Tiempo: <span id="timer">30</span>s</div>
                <div>Modo: <span id="mode-text">Fácil</span></div>
            </div>

            <div class="pattern-display" id="pattern-area"></div>

            <p style="font-weight: bold; color: #636e72;">¿Qué figura falta?</p>
            <div class="options-container" id="options-area"></div>
            
            <button class="btn-main" style="background: #bdc3c7; box-shadow: 0 5px 0 #95a5a6; font-size: 1rem;" onclick="showMenu()">Salir al Menú</button>
        </div>
    </div>

    <!-- Pantalla de resultado -->
    <div class="overlay" id="resultOverlay">
        <div id="resultMessage" class="message"></div>
        <div id="result-actions">
            <button class="btn-main" id="result-btn">Jugar de Nuevo</button>
            <button class="btn-main" style="background: #636e72; box-shadow: 0 5px 0 #2d3436;" onclick="showMenu()">Menú Principal</button>
        </div>
    </div>

    <script>
        const SHAPES = ['circle', 'square', 'rect'];
        let currentLevelIndex = 0;
        let activeDifficulty = 'easy';
        let timeLeft = 30;
        let timerInterval;
        let correctAnswer = '';
        let isGameActive = false;

        const allLevels = {
            easy: [
                { pattern: ['circle', 'square', 'circle'], answer: 'square' },
                { pattern: ['square', 'rect', 'square'], answer: 'rect' },
                { pattern: ['rect', 'circle', 'rect'], answer: 'circle' },
                { pattern: ['circle', 'circle', 'square'], answer: 'circle' },
                { pattern: ['square', 'square', 'rect'], answer: 'square' },
                { pattern: ['circle', 'rect', 'circle', 'rect'], answer: 'circle' }
            ],
            medium: [
                { pattern: ['circle', 'square', 'rect', 'circle'], answer: 'square' },
                { pattern: ['square', 'square', 'circle', 'circle', 'square'], answer: 'square' },
                { pattern: ['rect', 'rect', 'rect', 'circle', 'rect', 'rect'], answer: 'rect' },
                { pattern: ['circle', 'rect', 'square', 'circle', 'rect'], answer: 'square' },
                { pattern: ['square', 'rect', 'rect', 'square', 'rect'], answer: 'rect' },
                { pattern: ['circle', 'circle', 'circle', 'square', 'circle', 'circle'], answer: 'circle' }
            ],
            hard: [
                { pattern: ['circle', 'square', 'rect', 'circle', 'square'], answer: 'rect' },
                { pattern: ['square', 'circle', 'square', 'rect', 'square', 'circle'], answer: 'square' },
                { pattern: ['rect', 'square', 'square', 'circle', 'rect', 'square'], answer: 'square' },
                { pattern: ['circle', 'circle', 'rect', 'square', 'circle', 'circle', 'rect'], answer: 'square' },
                { pattern: ['square', 'rect', 'circle', 'square', 'rect', 'circle'], answer: 'square' },
                { pattern: ['rect', 'rect', 'circle', 'square', 'rect', 'rect', 'circle'], answer: 'square' }
            ]
        };

        const startScreen = document.getElementById('start-screen');
        const gameScreen = document.getElementById('game-screen');
        const patternArea = document.getElementById('pattern-area');
        const optionsArea = document.getElementById('options-area');
        const timerElement = document.getElementById('timer');
        const levelText = document.getElementById('level-text');
        const modeText = document.getElementById('mode-text');
        const overlay = document.getElementById('resultOverlay');
        const resultMessage = document.getElementById('resultMessage');
        const resultBtn = document.getElementById('result-btn');

        function showMenu() {
            clearInterval(timerInterval);
            isGameActive = false;
            // Ocultar overlay y pantalla de juego, mostrar menú
            overlay.style.display = 'none';
            gameScreen.style.display = 'none';
            startScreen.style.display = 'block';
        }

        function initGame(diff) {
            activeDifficulty = diff;
            currentLevelIndex = 0;
            // Limpiar estados previos
            overlay.style.display = 'none';
            startScreen.style.display = 'none';
            gameScreen.style.display = 'block';
            
            const labels = { easy: 'Fácil', medium: 'Medio', hard: 'Difícil' };
            modeText.textContent = labels[diff];
            
            loadLevel();
        }

        function loadLevel() {
            isGameActive = true;
            timeLeft = 30;
            updateTimerDisplay();
            levelText.textContent = `Nivel ${currentLevelIndex + 1} de 6`;
            
            clearInterval(timerInterval);
            startTimer();

            const levelData = allLevels[activeDifficulty][currentLevelIndex];
            correctAnswer = levelData.answer;

            patternArea.innerHTML = '';
            levelData.pattern.forEach(shapeType => {
                const el = document.createElement('div');
                el.className = `shape ${shapeType}`;
                patternArea.appendChild(el);
            });

            const slot = document.createElement('div');
            slot.className = 'missing-slot';
            slot.textContent = '?';
            patternArea.appendChild(slot);

            optionsArea.innerHTML = '';
            const shuffledOptions = [...SHAPES].sort(() => Math.random() - 0.5);
            
            shuffledOptions.forEach(shapeType => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.onclick = () => handleChoice(shapeType);
                
                const shapeImg = document.createElement('div');
                shapeImg.className = `shape ${shapeType}`;
                
                btn.appendChild(shapeImg);
                optionsArea.appendChild(btn);
            });
        }

        function startTimer() {
            timerElement.classList.remove('warning');
            timerInterval = setInterval(() => {
                timeLeft--;
                updateTimerDisplay();
                if (timeLeft <= 5) timerElement.classList.add('warning');
                if (timeLeft <= 0) endGame(false);
            }, 1000);
        }

        function updateTimerDisplay() {
            timerElement.textContent = timeLeft;
        }

        function handleChoice(choice) {
            if (!isGameActive) return;

            if (choice === correctAnswer) {
                if (currentLevelIndex < 5) {
                    currentLevelIndex++;
                    loadLevel();
                } else {
                    endGame(true);
                }
            } else {
                endGame(false);
            }
        }

        function endGame(isWin) {
            isGameActive = false;
            clearInterval(timerInterval);
            overlay.style.display = 'flex';

            if (isWin) {
                resultMessage.innerHTML = "¡EXCELENTE! 🌟<br><span style='font-size: 1.5rem'>Has completado el modo " + modeText.textContent + "</span>";
                resultMessage.className = "message win";
                resultBtn.textContent = "Reiniciar este modo";
                resultBtn.onclick = () => initGame(activeDifficulty);
            } else {
                resultMessage.innerHTML = "¡PERDISTE! 😟<br><span style='font-size: 1.5rem'>¡No te rindas, inténtalo otra vez!</span>";
                resultMessage.className = "message lose";
                resultBtn.textContent = "Reintentar";
                resultBtn.onclick = () => initGame(activeDifficulty);
            }
        }
    </script>
</body>
</html>
