<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎉 Juego de Memoria</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap');

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    background: linear-gradient(135deg, #a8edea 0%, #fed6e3 50%, #ffecd2 100%);
    font-family: 'Nunito', 'Comic Sans MS', cursive, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
    overflow-x: hidden;
  }

  .titulo {
    font-size: clamp(2rem, 6vw, 3.5rem);
    font-weight: 900;
    color: #fff;
    text-shadow: 3px 4px 0px #e07bb0, 6px 8px 0px rgba(0,0,0,0.1);
    margin-bottom: 10px;
    text-align: center;
    letter-spacing: 2px;
  }

  .estrellas {
    font-size: 1.6rem;
    margin-bottom: 16px;
    animation: flotar 2s ease-in-out infinite alternate;
    text-align: center;
  }

  @keyframes flotar {
    from { transform: translateY(0px); }
    to   { transform: translateY(-8px); }
  }

  .panel {
    background: rgba(255,255,255,0.85);
    backdrop-filter: blur(8px);
    border-radius: 28px;
    padding: 24px 28px;
    box-shadow: 0 8px 32px rgba(180,100,200,0.18), 0 2px 8px rgba(0,0,0,0.08);
    width: 100%;
    max-width: 520px;
  }

  .info-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
    gap: 10px;
    flex-wrap: wrap;
  }

  .badge {
    background: linear-gradient(135deg, #f093fb, #f5576c);
    color: #fff;
    border-radius: 50px;
    padding: 8px 20px;
    font-size: 1.2rem;
    font-weight: 800;
    box-shadow: 0 4px 12px rgba(240,100,200,0.3);
    min-width: 110px;
    text-align: center;
    letter-spacing: 1px;
  }

  .badge.verde {
    background: linear-gradient(135deg, #43e97b, #38f9d7);
    box-shadow: 0 4px 12px rgba(50,200,130,0.3);
  }

  .badge.azul {
    background: linear-gradient(135deg, #4facfe, #00f2fe);
    box-shadow: 0 4px 12px rgba(80,170,250,0.3);
  }

  .badge.tiempo-bajo {
    background: linear-gradient(135deg, #f7971e, #ffd200) !important;
    animation: pulso 0.6s ease-in-out infinite alternate;
    box-shadow: 0 4px 12px rgba(240,160,30,0.4) !important;
  }

  .badge.tiempo-critico {
    background: linear-gradient(135deg, #f5576c, #f093fb) !important;
    animation: pulso 0.3s ease-in-out infinite alternate;
  }

  @keyframes pulso {
    from { transform: scale(1); }
    to   { transform: scale(1.06); }
  }

  .tablero {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
    margin-bottom: 20px;
  }

  .carta {
    aspect-ratio: 1;
    border-radius: 16px;
    cursor: pointer;
    position: relative;
    transform-style: preserve-3d;
    transition: transform 0.45s cubic-bezier(.4,2,.6,1);
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  .carta.volteada,
  .carta.encontrada {
    transform: rotateY(180deg);
  }

  .carta.encontrada {
    cursor: default;
  }

  .carta-frente,
  .carta-dorso {
    position: absolute;
    width: 100%;
    height: 100%;
    border-radius: 16px;
    backface-visibility: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: clamp(1.6rem, 5vw, 2.4rem);
    line-height: 1;
  }

  .carta-dorso {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    box-shadow: 0 4px 12px rgba(100,80,200,0.25);
    border: 3px solid rgba(255,255,255,0.5);
    font-size: clamp(1.4rem, 4vw, 2rem);
  }

  .carta-dorso::after {
    content: '?';
    font-size: clamp(1.4rem, 4vw, 2.2rem);
    font-weight: 900;
    color: rgba(255,255,255,0.9);
    text-shadow: 0 2px 6px rgba(0,0,0,0.2);
  }

  .carta-frente {
    background: linear-gradient(135deg, #fff9c4, #fff3e0);
    transform: rotateY(180deg);
    border: 3px solid rgba(255,200,80,0.5);
    box-shadow: 0 4px 12px rgba(255,180,50,0.2);
  }

  .carta.encontrada .carta-frente {
    background: linear-gradient(135deg, #d4f5c5, #b8edd1);
    border-color: rgba(80,200,120,0.6);
    box-shadow: 0 4px 16px rgba(50,200,100,0.3);
    animation: encontrado 0.5s ease-out;
  }

  @keyframes encontrado {
    0%   { transform: rotateY(180deg) scale(1); }
    50%  { transform: rotateY(180deg) scale(1.15); }
    100% { transform: rotateY(180deg) scale(1); }
  }

  .carta:not(.volteada):not(.encontrada):hover .carta-dorso {
    background: linear-gradient(135deg, #7c93f5 0%, #9060c5 100%);
    transform: translateY(-3px);
    box-shadow: 0 8px 20px rgba(100,80,200,0.35);
    transition: all 0.2s;
  }

  .carta:not(.volteada):not(.encontrada) {
    transition: transform 0.45s cubic-bezier(.4,2,.6,1);
  }

  .carta.error .carta-frente {
    background: linear-gradient(135deg, #ffd6d6, #ffb3b3);
    border-color: rgba(220,50,50,0.4);
    animation: sacudir 0.4s ease-out;
  }

  @keyframes sacudir {
    0%,100% { transform: rotateY(180deg) translateX(0); }
    20%      { transform: rotateY(180deg) translateX(-5px); }
    40%      { transform: rotateY(180deg) translateX(5px); }
    60%      { transform: rotateY(180deg) translateX(-4px); }
    80%      { transform: rotateY(180deg) translateX(4px); }
  }

  .btn-inicio {
    display: block;
    width: 100%;
    padding: 16px 0;
    border: none;
    border-radius: 50px;
    font-family: inherit;
    font-size: 1.4rem;
    font-weight: 900;
    cursor: pointer;
    letter-spacing: 2px;
    transition: transform 0.15s, box-shadow 0.15s;
    color: #fff;
    background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
    box-shadow: 0 6px 20px rgba(240,90,200,0.4), 0 2px 0 rgba(0,0,0,0.1);
    text-shadow: 0 2px 4px rgba(0,0,0,0.15);
  }

  .btn-inicio:hover {
    transform: translateY(-3px) scale(1.02);
    box-shadow: 0 10px 28px rgba(240,90,200,0.45);
  }

  .btn-inicio:active {
    transform: translateY(1px) scale(0.98);
    box-shadow: 0 3px 10px rgba(240,90,200,0.3);
  }

  .mensaje {
    text-align: center;
    padding: 24px 16px 8px;
    animation: aparecer 0.5s cubic-bezier(.4,2,.6,1);
  }

  @keyframes aparecer {
    from { opacity:0; transform: scale(0.7) translateY(20px); }
    to   { opacity:1; transform: scale(1)   translateY(0); }
  }

  .mensaje-emoji {
    font-size: 4rem;
    display: block;
    margin-bottom: 8px;
    animation: rebotar 0.6s cubic-bezier(.4,2,.6,1) 0.2s both;
  }

  @keyframes rebotar {
    from { transform: scale(0); }
    to   { transform: scale(1); }
  }

  .mensaje-texto {
    font-size: 2.2rem;
    font-weight: 900;
    letter-spacing: 1px;
    line-height: 1.2;
  }

  .mensaje-texto.ganaste { color: #27ae60; text-shadow: 2px 3px 0 #a8f0c5; }
  .mensaje-texto.perdiste { color: #e74c3c; text-shadow: 2px 3px 0 #ffb3b3; }

  .mensaje-sub {
    font-size: 1rem;
    color: #888;
    margin-top: 4px;
    margin-bottom: 16px;
  }

  .confeti-wrapper {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 999;
    overflow: hidden;
  }

  .confeti-pieza {
    position: absolute;
    width: 12px;
    height: 12px;
    border-radius: 2px;
    animation: caer linear forwards;
    opacity: 0.9;
  }

  @keyframes caer {
    0%   { transform: translateY(-20px) rotate(0deg); opacity: 1; }
    100% { transform: translateY(110vh) rotate(720deg); opacity: 0; }
  }

  .estado-inicial {
    text-align: center;
    padding: 20px 0 8px;
  }

  .estado-inicial-emoji {
    font-size: 3rem;
    display: block;
    margin-bottom: 8px;
    animation: flotar 1.8s ease-in-out infinite alternate;
  }

  .estado-inicial-texto {
    font-size: 1.1rem;
    color: #9b59b6;
    font-weight: 700;
    margin-bottom: 16px;
  }

  .tablero-oculto {
    opacity: 0.3;
    pointer-events: none;
    filter: blur(1px);
    transition: opacity 0.4s, filter 0.4s;
  }
</style>
</head>
<body>

<div class="titulo">🃏 Memoria Mágica</div>
<div class="estrellas">⭐ ✨ 🌟 ✨ ⭐</div>

<div class="panel">
  <div class="info-bar">
    <div class="badge azul" id="badge-pares">🎯 Pares: 0/8</div>
    <div class="badge" id="badge-tiempo">⏱️ 2:00</div>
    <div class="badge verde" id="badge-intentos">🔄 Intentos: 0</div>
  </div>

  <div class="tablero tablero-oculto" id="tablero"></div>

  <div id="zona-mensaje"></div>

  <div id="zona-boton"></div>
</div>

<div class="confeti-wrapper" id="confeti"></div>

<script>
const EMOJIS = ['🐶','🐱','🐸','🦊','🐼','🦄','🐙','🦋','🍕','🍦','🌈','🎈','🚀','🎸','⚽','🏆'];

let tablero, segundosRestantes, timerID, paresEncontrados, cartasVolteadas, bloqueado, intentos;

function mezclar(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function formatTiempo(s) {
  const m = Math.floor(s / 60).toString().padStart(2,'0');
  const ss = (s % 60).toString().padStart(2,'0');
  return `⏱️ ${m}:${ss}`;
}

function actualizarBadge() {
  const badgeTiempo = document.getElementById('badge-tiempo');
  badgeTiempo.textContent = formatTiempo(segundosRestantes);
  badgeTiempo.className = 'badge';
  if (segundosRestantes <= 10) badgeTiempo.classList.add('tiempo-critico');
  else if (segundosRestantes <= 30) badgeTiempo.classList.add('tiempo-bajo');
  document.getElementById('badge-pares').textContent = `🎯 Pares: ${paresEncontrados}/8`;
  document.getElementById('badge-intentos').textContent = `🔄 Intentos: ${intentos}`;
}

function iniciarJuego() {
  clearInterval(timerID);
  paresEncontrados = 0;
  cartasVolteadas = [];
  bloqueado = false;
  intentos = 0;
  segundosRestantes = 120;

  document.getElementById('zona-mensaje').innerHTML = '';
  document.getElementById('zona-boton').innerHTML = '';
  document.getElementById('confeti').innerHTML = '';
  document.getElementById('tablero').classList.remove('tablero-oculto');

  const pares = mezclar(EMOJIS).slice(0, 8);
  tablero = mezclar([...pares, ...pares]);

  renderTablero();
  actualizarBadge();

  timerID = setInterval(() => {
    segundosRestantes--;
    actualizarBadge();
    if (segundosRestantes <= 0) {
      clearInterval(timerID);
      mostrarDerrota();
    }
  }, 1000);
}

function renderTablero() {
  const div = document.getElementById('tablero');
  div.innerHTML = '';
  tablero.forEach((emoji, i) => {
    const carta = document.createElement('div');
    carta.className = 'carta';
    carta.dataset.idx = i;
    carta.innerHTML = `<div class="carta-dorso"></div><div class="carta-frente">${emoji}</div>`;
    carta.addEventListener('click', () => voltearCarta(carta, i));
    div.appendChild(carta);
  });
}

function voltearCarta(carta, idx) {
  if (bloqueado) return;
  if (carta.classList.contains('volteada') || carta.classList.contains('encontrada')) return;

  carta.classList.add('volteada');
  cartasVolteadas.push({ carta, idx });

  if (cartasVolteadas.length === 2) {
    bloqueado = true;
    intentos++;
    const [a, b] = cartasVolteadas;
    if (tablero[a.idx] === tablero[b.idx]) {
      setTimeout(() => {
        a.carta.classList.remove('volteada');
        b.carta.classList.remove('volteada');
        a.carta.classList.add('encontrada');
        b.carta.classList.add('encontrada');
        cartasVolteadas = [];
        bloqueado = false;
        paresEncontrados++;
        actualizarBadge();
        if (paresEncontrados === 8) {
          clearInterval(timerID);
          setTimeout(mostrarVictoria, 400);
        }
      }, 500);
    } else {
      a.carta.classList.add('error');
      b.carta.classList.add('error');
      setTimeout(() => {
        a.carta.classList.remove('volteada','error');
        b.carta.classList.remove('volteada','error');
        cartasVolteadas = [];
        bloqueado = false;
      }, 900);
    }
  }
}

function mostrarVictoria() {
  document.getElementById('tablero').classList.add('tablero-oculto');
  document.getElementById('zona-mensaje').innerHTML = `
    <div class="mensaje">
      <span class="mensaje-emoji">🏆</span>
      <div class="mensaje-texto ganaste">¡Ganaste! 🎉</div>
      <div class="mensaje-sub">¡Excelente memoria! 🧠 Pares encontrados en ${intentos} intentos.</div>
    </div>`;
  mostrarBoton('🎮 ¡Jugar de nuevo!');
  lanzarConfeti();
}

function mostrarDerrota() {
  document.getElementById('tablero').classList.add('tablero-oculto');
  document.getElementById('zona-mensaje').innerHTML = `
    <div class="mensaje">
      <span class="mensaje-emoji">😢</span>
      <div class="mensaje-texto perdiste">¡Se acabó el tiempo!</div>
      <div class="mensaje-sub">¡Tú puedes! Inténtalo de nuevo. 💪</div>
    </div>`;
  mostrarBoton('🔄 ¡Intentar de nuevo!');
}

function mostrarBoton(texto) {
  document.getElementById('zona-boton').innerHTML = `
    <button class="btn-inicio" onclick="iniciarJuego()">${texto}</button>`;
}

function mostrarPantallaBienvenida() {
  document.getElementById('tablero').classList.add('tablero-oculto');
  document.getElementById('zona-mensaje').innerHTML = `
    <div class="estado-inicial">
      <span class="estado-inicial-emoji">🧩</span>
      <div class="estado-inicial-texto">Encuentra todos los pares de emojis<br>antes de que se acabe el tiempo ⏳</div>
    </div>`;
  document.getElementById('zona-boton').innerHTML = `
    <button class="btn-inicio" onclick="iniciarJuego()">🚀 ¡Comenzar!</button>`;
  document.getElementById('badge-tiempo').textContent = '⏱️ 2:00';
  document.getElementById('badge-pares').textContent = '🎯 Pares: 0/8';
  document.getElementById('badge-intentos').textContent = '🔄 Intentos: 0';
}

function lanzarConfeti() {
  const contenedor = document.getElementById('confeti');
  contenedor.innerHTML = '';
  const colores = ['#f093fb','#f5576c','#43e97b','#38f9d7','#4facfe','#ffd200','#f7971e','#a18cd1'];
  for (let i = 0; i < 80; i++) {
    const pieza = document.createElement('div');
    pieza.className = 'confeti-pieza';
    pieza.style.left = Math.random() * 100 + 'vw';
    pieza.style.top = '-20px';
    pieza.style.background = colores[Math.floor(Math.random() * colores.length)];
    pieza.style.animationDuration = (Math.random() * 2 + 1.5) + 's';
    pieza.style.animationDelay = (Math.random() * 1.2) + 's';
    pieza.style.width = pieza.style.height = (Math.random() * 10 + 8) + 'px';
    pieza.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
    contenedor.appendChild(pieza);
  }
  setTimeout(() => { contenedor.innerHTML = ''; }, 4000);
}

mostrarPantallaBienvenida();
</script>
</body>
</html>
