<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juego de Memoria Mágico</title>
    <style>
        :root {
            --primary: #ff6b6b;
            --secondary: #4ecdc4;
            --accent: #ffe66d;
            --bg: #f7fff7;
            --card-back: #6c5ce7;
            --text: #2d3436;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Comic Sans MS', 'Chalkboard SE', 'Arial Rounded MT Bold', sans-serif;
        }

        body {
            background-color: var(--bg);
            background-image: radial-gradient(#dff9fb 2px, transparent 2px);
            background-size: 30px 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            color: var(--text);
            overflow-x: hidden;
        }

        .container {
            text-align: center;
            padding: 20px;
            max-width: 500px;
            width: 100%;
        }

        h1 {
            color: var(--primary);
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 0px white;
        }

        .stats {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 20px;
            font-size: 1.2rem;
            font-weight: bold;
            background: white;
            padding: 10px;
            border-radius: 15px;
            box-shadow: 0 4px 0 rgba(0,0,0,0.1);
        }

        #timer.warning {
            color: var(--primary);
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin-bottom: 30px;
            perspective: 1000px;
        }

        .card {
            aspect-ratio: 1 / 1;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer;
        }

        .card.flipped {
            transform: rotateY(180deg);
        }

        .card.matched {
            transform: rotateY(180deg) scale(0.9);
            opacity: 0.8;
            cursor: default;
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            border-radius: 15px;
            box-shadow: 0 6px 0 rgba(0,0,0,0.1);
            user-select: none;
        }

        .card-front {
            background-color: white;
            transform: rotateY(180deg);
            border: 4px solid var(--secondary);
        }

        .card-back {
            background-color: var(--card-back);
            border: 4px solid #5649c0;
            color: white;
        }

        .card-back::after {
            content: '❓';
            font-size: 2rem;
            opacity: 0.5;
        }

        .btn-start {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.5rem;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 6px 0 #d63031;
            transition: all 0.2s;
            font-weight: bold;
        }

        .btn-start:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 0 #d63031;
        }

        .btn-start:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #d63031;
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.9);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }

        .overlay.active {
            display: flex;
        }

        .message {
            font-size: 3rem;
            margin-bottom: 20px;
            text-align: center;
        }

        .win { color: #2ecc71; }
        .lose { color: var(--primary); }

        /* Estilos móviles */
        @media (max-width: 400px) {
            .grid { gap: 8px; }
            .card-face { font-size: 1.8rem; }
            h1 { font-size: 1.8rem; }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>¡Memoria Mágica! 🎨</h1>
        
        <div class="stats">
            <div>Tiempo: <span id="timer">02:00</span></div>
            <div>Parejas: <span id="matches">0/8</span></div>
        </div>

        <div class="grid" id="gameGrid">
            <!-- Las cartas se generarán aquí -->
        </div>

        <div id="controls">
            <button class="btn-start" onclick="startGame()">¡JUGAR!</button>
        </div>
    </div>

    <!-- Pantalla de resultado -->
    <div class="overlay" id="resultOverlay">
        <div id="resultMessage" class="message"></div>
        <button class="btn-start" onclick="startGame()">Volver a Jugar</button>
    </div>

    <script>
        const emojis = ['🐶', '🐱', '🦁', '🐘', '🦒', '🐧', '🦉', '🐸'];
        let cards = [];
        let flippedCards = [];
        let matchedCount = 0;
        let timerInterval;
        let timeLeft = 120;
        let isGameActive = false;

        const gridElement = document.getElementById('gameGrid');
        const timerElement = document.getElementById('timer');
        const matchesElement = document.getElementById('matches');
        const overlay = document.getElementById('resultOverlay');
        const resultMessage = document.getElementById('resultMessage');

        // Inicializar tablero vacío
        function createEmptyGrid() {
            gridElement.innerHTML = '';
            for (let i = 0; i < 16; i++) {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div class="card-face card-back"></div>
                    <div class="card-face card-front"></div>
                `;
                gridElement.appendChild(card);
            }
        }

        function startGame() {
            // Reiniciar variables
            overlay.classList.remove('active');
            flippedCards = [];
            matchedCount = 0;
            timeLeft = 120;
            isGameActive = true;
            matchesElement.textContent = `0/8`;
            timerElement.classList.remove('warning');
            updateTimerDisplay();
            
            // Limpiar intervalos previos
            clearInterval(timerInterval);

            // Mezclar emojis
            const deck = [...emojis, ...emojis]
                .sort(() => Math.random() - 0.5);

            // Crear tablero
            gridElement.innerHTML = '';
            deck.forEach((emoji, index) => {
                const card = document.createElement('div');
                card.className = 'card';
                card.dataset.emoji = emoji;
                card.dataset.index = index;
                card.onclick = () => flipCard(card);
                
                card.innerHTML = `
                    <div class="card-face card-back"></div>
                    <div class="card-face card-front">${emoji}</div>
                `;
                gridElement.appendChild(card);
            });

            // Iniciar cronómetro
            timerInterval = setInterval(() => {
                timeLeft--;
                updateTimerDisplay();
                
                if (timeLeft <= 10) {
                    timerElement.classList.add('warning');
                }

                if (timeLeft <= 0) {
                    endGame(false);
                }
            }, 1000);
        }

        function updateTimerDisplay() {
            const minutes = Math.floor(timeLeft / 60);
            const seconds = timeLeft % 60;
            timerElement.textContent = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
        }

        function flipCard(card) {
            if (!isGameActive || card.classList.contains('flipped') || card.classList.contains('matched') || flippedCards.length >= 2) {
                return;
            }

            card.classList.add('flipped');
            flippedCards.push(card);

            if (flippedCards.length === 2) {
                checkMatch();
            }
        }

        function checkMatch() {
            const [card1, card2] = flippedCards;
            const isMatch = card1.dataset.emoji === card2.dataset.emoji;

            if (isMatch) {
                setTimeout(() => {
                    card1.classList.add('matched');
                    card2.classList.add('matched');
                    matchedCount++;
                    matchesElement.textContent = `${matchedCount}/8`;
                    flippedCards = [];

                    if (matchedCount === 8) {
                        endGame(true);
                    }
                }, 500);
            } else {
                setTimeout(() => {
                    card1.classList.remove('flipped');
                    card2.classList.remove('flipped');
                    flippedCards = [];
                }, 1000);
            }
        }

        function endGame(isWin) {
            isGameActive = false;
            clearInterval(timerInterval);
            
            overlay.classList.add('active');
            if (isWin) {
                resultMessage.innerHTML = "¡GANASTE! 🏆<br><span style='font-size: 1.5rem'>¡Eres genial!</span>";
                resultMessage.className = "message win";
            } else {
                resultMessage.innerHTML = "¡PERDISTE! ⏰<br><span style='font-size: 1.5rem'>¡Inténtalo de nuevo!</span>";
                resultMessage.className = "message lose";
            }
        }

        // Crear cuadrícula inicial estética
        createEmptyGrid();
    </script>
</body>
</html>
