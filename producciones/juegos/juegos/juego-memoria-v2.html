<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juego de Memoria Mágico</title>
    <style>
        :root {
            --primary: #ff6b6b;
            --secondary: #4ecdc4;
            --success: #2ecc71;
            --accent: #ffe66d;
            --bg: #f7fff7;
            --card-back: #6c5ce7;
            --text: #2d3436;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Comic Sans MS', 'Chalkboard SE', 'Arial Rounded MT Bold', sans-serif;
        }

        body {
            background-color: var(--bg);
            background-image: radial-gradient(#dff9fb 2px, transparent 2px);
            background-size: 30px 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            color: var(--text);
            overflow: hidden; 
        }

        .main-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 30px;
            padding: 20px;
            max-width: 850px;
            width: 100%;
        }

        .game-section {
            flex: 1;
            max-width: 400px;
        }

        .side-section {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 180px;
        }

        h1 {
            color: var(--primary);
            font-size: 1.8rem;
            margin-bottom: 10px;
            text-align: center;
        }

        .stats-card {
            background: white;
            padding: 15px;
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            text-align: center;
            border: 2px solid #eee;
        }

        .stat-item {
            margin: 5px 0;
            font-size: 1rem;
            font-weight: bold;
        }

        .stat-value {
            display: block;
            font-size: 1.4rem;
            color: var(--secondary);
        }

        #timer.warning {
            color: var(--primary);
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            perspective: 1000px;
        }

        .card {
            aspect-ratio: 1 / 1;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer;
            width: 100%;
        }

        .card.flipped {
            transform: rotateY(180deg);
        }

        /* ESTILO PARA CARTAS ACERTADAS */
        .card.matched {
            transform: rotateY(180deg) scale(0.95);
            cursor: default;
        }

        .card.matched .card-front {
            background-color: #e8f8f0; /* Fondo verde clarito */
            border: 4px solid var(--success); /* Borde verde fuerte */
            box-shadow: 0 0 15px rgba(46, 204, 113, 0.3);
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 0 rgba(0,0,0,0.1);
            user-select: none;
        }

        .card-front {
            background-color: white;
            transform: rotateY(180deg);
            border: 3px solid var(--secondary);
            transition: background-color 0.3s, border 0.3s;
        }

        .card-back {
            background: linear-gradient(135deg, var(--card-back), #5649c0);
            border: 3px solid white;
            color: white;
        }

        .card-back::after {
            content: '❓';
            font-size: 1.2rem;
            opacity: 0.4;
        }

        .btn-action {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 15px 10px;
            font-size: 1.2rem;
            border-radius: 15px;
            cursor: pointer;
            box-shadow: 0 5px 0 #d63031;
            transition: all 0.2s;
            font-weight: bold;
            width: 100%;
        }

        .btn-action:active {
            transform: translateY(3px);
            box-shadow: 0 2px 0 #d63031;
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.96);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            backdrop-filter: blur(4px);
        }

        .overlay.active {
            display: flex;
        }

        .message {
            font-size: 2.5rem;
            margin-bottom: 20px;
            text-align: center;
            font-weight: bold;
        }

        .win { color: var(--success); }
        .lose { color: var(--primary); }

        @media (max-width: 600px) {
            .main-wrapper {
                flex-direction: column;
                gap: 15px;
                overflow-y: auto;
            }
            body { overflow: auto; }
            .side-section {
                width: 100%;
                flex-direction: row;
                justify-content: center;
            }
            .stats-card { flex: 1; padding: 5px; }
            .btn-action { flex: 1; }
        }
    </style>
</head>
<body>

    <div class="main-wrapper">
        <div class="game-section">
            <h1>¡Memoria Mágica! 🎨</h1>
            <div class="grid" id="gameGrid"></div>
        </div>

        <div class="side-section">
            <div class="stats-card">
                <div class="stat-item">
                    Tiempo
                    <span id="timer" class="stat-value">02:00</span>
                </div>
                <div class="stat-item">
                    Parejas
                    <span id="matches" class="stat-value">0/8</span>
                </div>
            </div>
            <button class="btn-action" onclick="startGame()">¡EMPEZAR!</button>
        </div>
    </div>

    <div class="overlay" id="resultOverlay">
        <div id="resultMessage" class="message"></div>
        <button class="btn-action" style="max-width: 250px;" onclick="startGame()">Jugar de Nuevo</button>
    </div>

    <script>
        const emojis = ['🐶', '🐱', '🦁', '🐘', '🦒', '🐧', '🦉', '🐸'];
        let flippedCards = [];
        let matchedCount = 0;
        let timerInterval;
        let timeLeft = 120;
        let isGameActive = false;

        const gridElement = document.getElementById('gameGrid');
        const timerElement = document.getElementById('timer');
        const matchesElement = document.getElementById('matches');
        const overlay = document.getElementById('resultOverlay');
        const resultMessage = document.getElementById('resultMessage');

        function createInitialGrid() {
            gridElement.innerHTML = '';
            for (let i = 0; i < 16; i++) {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `<div class="card-face card-back"></div><div class="card-face card-front"></div>`;
                gridElement.appendChild(card);
            }
        }

        function startGame() {
            overlay.classList.remove('active');
            flippedCards = [];
            matchedCount = 0;
            timeLeft = 120;
            isGameActive = true;
            matchesElement.textContent = `0/8`;
            timerElement.classList.remove('warning');
            updateTimerDisplay();
            
            clearInterval(timerInterval);

            const deck = [...emojis, ...emojis].sort(() => Math.random() - 0.5);

            gridElement.innerHTML = '';
            deck.forEach((emoji) => {
                const card = document.createElement('div');
                card.className = 'card';
                card.dataset.emoji = emoji;
                card.onclick = () => flipCard(card);
                card.innerHTML = `
                    <div class="card-face card-back"></div>
                    <div class="card-face card-front">${emoji}</div>
                `;
                gridElement.appendChild(card);
            });

            timerInterval = setInterval(() => {
                timeLeft--;
                updateTimerDisplay();
                if (timeLeft <= 15) timerElement.classList.add('warning');
                if (timeLeft <= 0) endGame(false);
            }, 1000);
        }

        function updateTimerDisplay() {
            const minutes = Math.floor(timeLeft / 60);
            const seconds = timeLeft % 60;
            timerElement.textContent = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
        }

        function flipCard(card) {
            if (!isGameActive || card.classList.contains('flipped') || card.classList.contains('matched') || flippedCards.length >= 2) return;
            card.classList.add('flipped');
            flippedCards.push(card);
            if (flippedCards.length === 2) checkMatch();
        }

        function checkMatch() {
            const [card1, card2] = flippedCards;
            const isMatch = card1.dataset.emoji === card2.dataset.emoji;

            if (isMatch) {
                setTimeout(() => {
                    card1.classList.add('matched');
                    card2.classList.add('matched');
                    matchedCount++;
                    matchesElement.textContent = `${matchedCount}/8`;
                    flippedCards = [];
                    if (matchedCount === 8) endGame(true);
                }, 500);
            } else {
                setTimeout(() => {
                    card1.classList.remove('flipped');
                    card2.classList.remove('flipped');
                    flippedCards = [];
                }, 800);
            }
        }

        function endGame(isWin) {
            isGameActive = false;
            clearInterval(timerInterval);
            overlay.classList.add('active');
            if (isWin) {
                resultMessage.innerHTML = "¡GANASTE! 🏆<br><span style='font-size: 1.2rem'>¡Memoria de elefante!</span>";
                resultMessage.className = "message win";
            } else {
                resultMessage.innerHTML = "¡TIEMPO AGOTADO! ⏰<br><span style='font-size: 1.2rem'>¡Inténtalo otra vez!</span>";
                resultMessage.className = "message lose";
            }
        }

        createInitialGrid();
    </script>
</body>
</html>
