<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Juego de Patrones</title>

<style>
body {
    font-family: Arial, sans-serif;
    text-align: center;
    margin: 0;
    background: #f0f4f8;
}

h1 {
    margin-top: 20px;
    color: #333;
}

#info {
    margin-top: 10px;
    font-size: 18px;
    color: #444;
}

#game {
    margin-top: 30px;
}

.row {
    display: flex;
    justify-content: center;
    gap: 15px;
}

.shape {
    width: 70px;
    height: 70px;
    cursor: pointer;
    transition: transform 0.2s;
}

.shape:hover {
    transform: scale(1.15);
}

/* FIGURAS */
.circle { background: #ff4d4d; border-radius: 50%; }

.square { background: #4da6ff; }

.triangle {
    width: 0;
    height: 0;
    border-left: 35px solid transparent;
    border-right: 35px solid transparent;
    border-bottom: 70px solid #4dff88;
}

.rectangle {
    width: 90px;
    height: 60px;
    background: #ffd24d;
}

.missing {
    background: #ccc;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 30px;
    border-radius: 10px;
}

.options {
    margin-top: 30px;
    display: flex;
    justify-content: center;
    gap: 25px;
}

button {
    margin-top: 20px;
    padding: 10px 25px;
    border: none;
    border-radius: 10px;
    background: #333;
    color: white;
    font-size: 16px;
    cursor: pointer;
}

#timer {
    font-size: 20px;
    margin-top: 10px;
    color: #333;
}

.feedback {
    font-size: 20px;
    margin-top: 15px;
}
</style>
</head>

<body>

<h1>🧠 Juego de Patrones</h1>

<div id="info">
    Nivel: <span id="level">-</span> | ⏱ <span id="timer">0</span>s
</div>

<button onclick="startGame()">Comenzar</button>

<div id="game"></div>
<div id="options" class="options"></div>
<div id="feedback" class="feedback"></div>

<script>
const shapes = ["circle","square","triangle","rectangle"];

let level = 1;
let correctAnswer;
let timer;
let timeLeft = 30;

function startGame() {
    level = 1;
    nextLevel();
}

function nextLevel() {
    if (level > 6) {
        document.getElementById("game").innerHTML = "<h2>🎉 GANASTE 🎉</h2><button onclick='startGame()'>Jugar otra vez</button>";
        document.getElementById("options").innerHTML = "";
        return;
    }

    document.getElementById("level").innerText = level;
    document.getElementById("feedback").innerText = "";

    timeLeft = 30;
    startTimer();
    generatePattern();
}

function startTimer(){
    clearInterval(timer);
    timer = setInterval(()=>{
        timeLeft--;
        document.getElementById("timer").innerText = timeLeft;
        if(timeLeft <= 0) lose();
    },1000);
}

function generatePattern(){
    let pattern;

    switch(level){
        case 1:
            pattern = ["circle","square","circle","square","circle"];
            break;

        case 2:
            pattern = ["circle","circle","square","circle","circle"];
            break;

        case 3:
            pattern = ["circle","square","triangle","circle","square"];
            break;

        case 4:
            pattern = ["circle","square","square","circle","square"];
            break;

        case 5:
            pattern = ["circle","square","triangle","square","circle"];
            break;

        case 6:
            pattern = ["circle","triangle","circle","triangle","circle"];
            break;
    }

    let missingIndex = Math.floor(Math.random()*pattern.length);
    correctAnswer = pattern[missingIndex];

    const game = document.getElementById("game");
    game.innerHTML = "";

    const row = document.createElement("div");
    row.className = "row";

    pattern.forEach((shape,i)=>{
        let div = document.createElement("div");
        div.className = "shape";

        if(i === missingIndex){
            div.classList.add("missing");
            div.innerText = "?";
        } else {
            div.classList.add(shape);
        }

        row.appendChild(div);
    });

    game.appendChild(row);
    generateOptions();
}

function generateOptions(){
    const optionsDiv = document.getElementById("options");
    optionsDiv.innerHTML = "";

    shapes.forEach(shape=>{
        let div = document.createElement("div");
        div.className = "shape " + shape;
        div.onclick = ()=>checkAnswer(shape);
        optionsDiv.appendChild(div);
    });
}

function checkAnswer(ans){
    if(ans === correctAnswer){
        document.getElementById("feedback").innerText = "✅ Correcto";
        setTimeout(()=>{
            level++;
            nextLevel();
        },700);
    } else {
        lose();
    }
}

function lose(){
    clearInterval(timer);
    document.getElementById("game").innerHTML = "<h2>❌ PERDISTE ❌</h2><button onclick='startGame()'>Reintentar</button>";
    document.getElementById("options").innerHTML = "";
    document.getElementById("feedback").innerText = "";
}
</script>

</body>
</html>
