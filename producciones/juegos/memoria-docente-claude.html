<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MemoMentes — Entrená tu memoria</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;700;800&family=Quicksand:wght@400;500;600;700&display=swap');

:root {
  --sky:     #e8f4fd;
  --sky2:    #cce8f8;
  --mint:    #e0f5ec;
  --sun:     #fff7e0;
  --coral:   #ff6b6b;
  --teal:    #2ec4b6;
  --amber:   #ffb703;
  --violet:  #7b5ea7;
  --navy:    #1d3557;
  --ink:     #2b2d42;
  --muted:   #6b7280;
  --card-bg: #ffffff;
  --r:       16px;
  --shadow:  0 4px 24px rgba(45,45,66,0.10);
  --shadow-sm: 0 2px 8px rgba(45,45,66,0.08);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  min-height: 100vh;
  background: #f0f8ff;
  background-image:
    radial-gradient(circle at 15% 20%, #c7eaff 0%, transparent 45%),
    radial-gradient(circle at 85% 75%, #d4f5e9 0%, transparent 45%),
    radial-gradient(circle at 50% 50%, #fff7e0 0%, transparent 60%);
  font-family: 'Quicksand', sans-serif;
  color: var(--ink);
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 24px 16px 40px;
  position: relative;
  overflow-x: hidden;
}

/* Decorative dots */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image: radial-gradient(circle, #b0d4f0 1.2px, transparent 1.2px);
  background-size: 32px 32px;
  opacity: 0.25;
  pointer-events: none;
  z-index: 0;
}

/* ───── HEADER ───── */
.header {
  text-align: center;
  margin-bottom: 28px;
  position: relative;
  z-index: 1;
}

.logo-badge {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  background: var(--navy);
  color: #fff;
  padding: 8px 22px 8px 16px;
  border-radius: 50px;
  margin-bottom: 12px;
  box-shadow: 0 4px 14px rgba(29,53,87,0.25);
}

.logo-badge .icon { font-size: 1.4rem; }

.logo-badge .brand {
  font-family: 'Baloo 2', cursive;
  font-size: 1.05rem;
  font-weight: 800;
  letter-spacing: 0.5px;
}

.logo-badge .tagline {
  font-size: 0.72rem;
  font-weight: 500;
  color: rgba(255,255,255,0.65);
  letter-spacing: 1px;
  text-transform: uppercase;
  display: block;
  line-height: 1;
}

h1 {
  font-family: 'Baloo 2', cursive;
  font-size: clamp(2rem, 6vw, 3.2rem);
  font-weight: 800;
  color: var(--navy);
  line-height: 1.1;
  letter-spacing: -0.5px;
}

h1 span { color: var(--teal); }

.subtitle {
  font-size: 1rem;
  color: var(--muted);
  font-weight: 500;
  margin-top: 6px;
}

/* ───── SKILL BAR ───── */
.skill-strip {
  display: flex;
  gap: 10px;
  margin-bottom: 20px;
  position: relative;
  z-index: 1;
  flex-wrap: wrap;
  justify-content: center;
}

.skill-pill {
  background: var(--card-bg);
  border: 1.5px solid #dde7f0;
  border-radius: 50px;
  padding: 6px 16px;
  font-size: 0.82rem;
  font-weight: 600;
  color: var(--navy);
  display: flex;
  align-items: center;
  gap: 6px;
  box-shadow: var(--shadow-sm);
}

.skill-pill .dot {
  width: 8px; height: 8px;
  border-radius: 50%;
}

/* ───── MAIN CARD ───── */
.main-card {
  background: var(--card-bg);
  border-radius: 28px;
  box-shadow: var(--shadow), 0 0 0 1px rgba(180,210,240,0.4);
  width: 100%;
  max-width: 560px;
  overflow: hidden;
  position: relative;
  z-index: 1;
}

/* ───── LEVEL SELECTOR ───── */
.level-bar {
  display: flex;
  background: var(--sky);
  border-bottom: 1.5px solid var(--sky2);
}

.level-btn {
  flex: 1;
  padding: 12px 4px;
  border: none;
  background: transparent;
  font-family: 'Quicksand', sans-serif;
  font-size: 0.82rem;
  font-weight: 700;
  color: var(--muted);
  cursor: pointer;
  transition: all 0.2s;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  border-bottom: 3px solid transparent;
}

.level-btn .lv-icon { font-size: 1.3rem; }
.level-btn .lv-name { letter-spacing: 0.3px; }
.level-btn .lv-desc { font-size: 0.68rem; font-weight: 500; color: #a0adb8; }

.level-btn:hover { background: rgba(46,196,182,0.08); color: var(--teal); }

.level-btn.active {
  background: var(--card-bg);
  color: var(--navy);
  border-bottom-color: var(--teal);
}

.level-btn.active .lv-desc { color: var(--teal); }

/* ───── STATS ROW ───── */
.stats-row {
  display: flex;
  gap: 0;
  padding: 14px 20px;
  border-bottom: 1px solid #eef2f7;
  align-items: center;
}

.stat {
  flex: 1;
  text-align: center;
}

.stat + .stat {
  border-left: 1px solid #eef2f7;
}

.stat-val {
  font-family: 'Baloo 2', cursive;
  font-size: 1.4rem;
  font-weight: 800;
  color: var(--navy);
  line-height: 1;
  display: block;
}

.stat-val.timer-low   { color: var(--amber); }
.stat-val.timer-crit  { color: var(--coral); animation: blink .5s infinite alternate; }

@keyframes blink { to { opacity: 0.5; } }

.stat-label {
  font-size: 0.7rem;
  font-weight: 600;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.8px;
}

/* ───── BOARD AREA ───── */
.board-wrap {
  padding: 18px 18px 12px;
}

.tablero {
  display: grid;
  gap: 10px;
}

.tablero.grid-4x4 { grid-template-columns: repeat(4, 1fr); }
.tablero.grid-4x3 { grid-template-columns: repeat(4, 1fr); }
.tablero.grid-3x2 { grid-template-columns: repeat(4, 1fr); }

/* ───── CARTAS ───── */
.carta {
  aspect-ratio: 1;
  perspective: 600px;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}

.carta-inner {
  width: 100%;
  height: 100%;
  position: relative;
  transform-style: preserve-3d;
  transition: transform 0.42s cubic-bezier(.4,2,.55,1);
}

.carta.volteada .carta-inner,
.carta.encontrada .carta-inner { transform: rotateY(180deg); }

.cara {
  position: absolute;
  inset: 0;
  border-radius: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
}

.cara-dorso {
  background: var(--navy);
  border: 2px solid rgba(255,255,255,0.12);
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.1);
  transition: background 0.2s;
}

.carta:not(.volteada):not(.encontrada):hover .cara-dorso {
  background: #2a4a6e;
}

.cara-dorso-pattern {
  display: grid;
  grid-template-columns: repeat(3,1fr);
  gap: 4px;
  padding: 8px;
  opacity: 0.25;
}

.cara-dorso-pattern span {
  width: 5px; height: 5px;
  border-radius: 50%;
  background: #fff;
  display: block;
}

.cara-frente {
  background: var(--card-bg);
  border: 2px solid #e0ecf8;
  transform: rotateY(180deg);
  font-size: clamp(1.4rem, 4.5vw, 2.2rem);
  box-shadow: var(--shadow-sm);
}

.carta.encontrada .cara-frente {
  background: var(--mint);
  border-color: #9edfc2;
  animation: pop .45s cubic-bezier(.4,2,.55,1);
}

@keyframes pop {
  0%   { transform: rotateY(180deg) scale(1); }
  50%  { transform: rotateY(180deg) scale(1.2); }
  100% { transform: rotateY(180deg) scale(1); }
}

.carta.error .cara-frente {
  background: #fff0f0;
  border-color: #ffbcbc;
  animation: shake .4s ease;
}

@keyframes shake {
  0%,100% { transform: rotateY(180deg) translateX(0); }
  25%      { transform: rotateY(180deg) translateX(-6px); }
  75%      { transform: rotateY(180deg) translateX(6px); }
}

/* ───── FEEDBACK BAR ───── */
.feedback-bar {
  margin: 0 18px 16px;
  background: var(--sky);
  border: 1.5px solid var(--sky2);
  border-radius: var(--r);
  padding: 10px 16px;
  display: flex;
  align-items: center;
  gap: 10px;
  min-height: 52px;
  transition: all 0.3s;
}

.feedback-bar.hidden { opacity: 0; pointer-events: none; }
.fb-icon { font-size: 1.5rem; flex-shrink: 0; }
.fb-text { font-size: 0.88rem; font-weight: 600; color: var(--navy); line-height: 1.4; }
.fb-sub  { font-size: 0.76rem; color: var(--muted); font-weight: 500; }

.feedback-bar.hit  { background: var(--mint); border-color: #9edfc2; }
.feedback-bar.miss { background: #fff4f4; border-color: #ffcaca; }
.feedback-bar.tip  { background: var(--sun); border-color: #ffe59c; }

/* ───── PROGRESS BAR ───── */
.progress-wrap {
  padding: 0 18px 16px;
}

.progress-label {
  display: flex;
  justify-content: space-between;
  font-size: 0.75rem;
  font-weight: 600;
  color: var(--muted);
  margin-bottom: 6px;
  text-transform: uppercase;
  letter-spacing: 0.6px;
}

.progress-track {
  height: 8px;
  background: var(--sky2);
  border-radius: 99px;
  overflow: hidden;
}

.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--teal), #43e97b);
  border-radius: 99px;
  transition: width 0.5s cubic-bezier(.4,0,.2,1);
  width: 0%;
}

/* ───── ESTADO INICIAL / MENSAJE FINAL ───── */
.pantalla {
  padding: 28px 24px 24px;
  text-align: center;
  animation: fadeUp .5s cubic-bezier(.4,2,.55,1);
}

@keyframes fadeUp {
  from { opacity:0; transform: translateY(18px); }
  to   { opacity:1; transform: translateY(0); }
}

.pantalla-icon { font-size: 3.8rem; margin-bottom: 10px; display: block; }

.pantalla-title {
  font-family: 'Baloo 2', cursive;
  font-size: 1.9rem;
  font-weight: 800;
  color: var(--navy);
  margin-bottom: 4px;
}

.pantalla-title.win  { color: var(--teal); }
.pantalla-title.lose { color: var(--coral); }

.pantalla-body {
  font-size: 0.92rem;
  color: var(--muted);
  font-weight: 500;
  line-height: 1.6;
  max-width: 360px;
  margin: 0 auto 18px;
}

/* Habilidades trabajadas */
.skills-worked {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  justify-content: center;
  margin-bottom: 20px;
}

.sw-chip {
  background: var(--sky);
  border: 1.5px solid var(--sky2);
  border-radius: 50px;
  padding: 5px 14px;
  font-size: 0.78rem;
  font-weight: 700;
  color: var(--navy);
  display: flex;
  align-items: center;
  gap: 5px;
}

/* Score cards */
.score-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  margin-bottom: 20px;
}

.sc-card {
  background: var(--sky);
  border-radius: 14px;
  padding: 10px 8px;
  border: 1.5px solid var(--sky2);
}

.sc-val {
  font-family: 'Baloo 2', cursive;
  font-size: 1.6rem;
  font-weight: 800;
  color: var(--navy);
  display: block;
}

.sc-lbl {
  font-size: 0.68rem;
  font-weight: 600;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.7px;
}

/* Nivel info en welcome */
.level-info-grid {
  display: grid;
  grid-template-columns: repeat(3,1fr);
  gap: 10px;
  margin-bottom: 22px;
}

.li-card {
  border-radius: 14px;
  padding: 12px 10px;
  cursor: pointer;
  border: 2px solid transparent;
  transition: all 0.2s;
}

.li-card:hover { transform: translateY(-3px); box-shadow: var(--shadow); }
.li-card.selected { border-color: var(--teal); box-shadow: 0 0 0 3px rgba(46,196,182,0.15); }

.li-icon { font-size: 2rem; display: block; margin-bottom: 4px; }
.li-name { font-family: 'Baloo 2', cursive; font-size: 0.9rem; font-weight: 800; color: var(--navy); display: block; }
.li-desc { font-size: 0.7rem; font-weight: 500; color: var(--muted); display: block; margin-top: 1px; }

/* ───── BOTÓN ───── */
.btn-primary {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  background: var(--navy);
  color: #fff;
  border: none;
  border-radius: 50px;
  padding: 14px 36px;
  font-family: 'Baloo 2', cursive;
  font-size: 1.1rem;
  font-weight: 700;
  cursor: pointer;
  transition: transform 0.15s, box-shadow 0.15s, background 0.15s;
  box-shadow: 0 5px 18px rgba(29,53,87,0.28);
  letter-spacing: 0.3px;
  width: 100%;
}

.btn-primary:hover {
  background: #264d7a;
  transform: translateY(-2px);
  box-shadow: 0 8px 24px rgba(29,53,87,0.32);
}

.btn-primary:active { transform: scale(0.97); }
.btn-primary.teal { background: var(--teal); box-shadow: 0 5px 18px rgba(46,196,182,0.35); }
.btn-primary.teal:hover { background: #27ada1; }

/* ───── TEACHER NOTE ───── */
.teacher-note {
  margin: 20px 0 0;
  padding: 14px 16px;
  background: var(--sun);
  border-left: 4px solid var(--amber);
  border-radius: 0 12px 12px 0;
  text-align: left;
}

.tn-title {
  font-size: 0.78rem;
  font-weight: 700;
  color: #b07800;
  text-transform: uppercase;
  letter-spacing: 0.8px;
  margin-bottom: 4px;
  display: flex;
  align-items: center;
  gap: 5px;
}

.tn-body {
  font-size: 0.82rem;
  font-weight: 500;
  color: #6b5700;
  line-height: 1.55;
}

/* ───── CONFETTI ───── */
.confetti-wrap {
  position: fixed; inset: 0;
  pointer-events: none;
  z-index: 999;
  overflow: hidden;
}

.cp {
  position: absolute;
  border-radius: 2px;
  animation: fall linear forwards;
}

@keyframes fall {
  0%   { transform: translateY(-10px) rotate(0deg); opacity: 1; }
  100% { transform: translateY(105vh) rotate(540deg); opacity: 0; }
}

/* ───── RESPONSIVE ───── */
@media (max-width: 400px) {
  .level-btn .lv-desc { display: none; }
  .score-grid { grid-template-columns: repeat(3,1fr); }
  .level-info-grid { grid-template-columns: repeat(3,1fr); }
}
</style>
</head>
<body>

<div class="confetti-wrap" id="confetti"></div>

<header class="header">
  <div class="logo-badge">
    <span class="icon">🧠</span>
    <div>
      <span class="brand">MemoMentes</span>
      <span class="tagline">Programa de memoria cognitiva</span>
    </div>
  </div>
  <h1>Entrená tu <span>memoria</span></h1>
  <p class="subtitle">Juego educativo para desarrollar atención y memoria visual</p>
</header>

<div class="skill-strip">
  <div class="skill-pill"><span class="dot" style="background:#2ec4b6"></span>Memoria visual</div>
  <div class="skill-pill"><span class="dot" style="background:#ffb703"></span>Atención sostenida</div>
  <div class="skill-pill"><span class="dot" style="background:#7b5ea7"></span>Concentración</div>
  <div class="skill-pill"><span class="dot" style="background:#ff6b6b"></span>Estrategia</div>
</div>

<div class="main-card" id="main-card">

  <div class="level-bar" id="level-bar">
    <button class="level-btn active" data-level="0" onclick="selectLevel(0)">
      <span class="lv-icon">🌱</span>
      <span class="lv-name">Inicial</span>
      <span class="lv-desc">3×2 · 3 min</span>
    </button>
    <button class="level-btn" data-level="1" onclick="selectLevel(1)">
      <span class="lv-icon">🌿</span>
      <span class="lv-name">Explorador</span>
      <span class="lv-desc">4×3 · 2.5 min</span>
    </button>
    <button class="level-btn" data-level="2" onclick="selectLevel(2)">
      <span class="lv-icon">🏆</span>
      <span class="lv-name">Experto</span>
      <span class="lv-desc">4×4 · 2 min</span>
    </button>
  </div>

  <div id="app-content"></div>

</div>

<script>
const NIVELES = [
  { pares: 6,  cols: 4, tiempoSeg: 180, nombre: 'Inicial',    icon: '🌱', gridClass: 'grid-3x2' },
  { pares: 10, cols: 4, tiempoSeg: 150, nombre: 'Explorador', icon: '🌿', gridClass: 'grid-4x3' },
  { pares: 8,  cols: 4, tiempoSeg: 120, nombre: 'Experto',    icon: '🏆', gridClass: 'grid-4x4' },
];

// Reorganizado: nivel 0 = 6 pares (12 cartas), nivel 1 = 10 pares (20→usamos 4x3=12→ajustar a 6 pares también? No: nivel medio = 8 pares = 16 cartas 4x4)
// Recalcular: nivel 0 = 3 filas × 4 = 12 cartas = 6 pares; nivel 1 = 3 filas × 4 = 12 cartas = 6 pares...
// Mejor: Inicial=3x4=12=6pares, Explorador=4x4=16=8pares con menos tiempo, Experto=4x4=16=8pares muy poco tiempo
const CONFIGS = [
  { pares: 6,  filas: 3, cols: 4, tiempoSeg: 180, nombre: 'Inicial',    icon: '🌱', gridClass: 'grid-4x4' },
  { pares: 8,  filas: 4, cols: 4, tiempoSeg: 150, nombre: 'Explorador', icon: '🌿', gridClass: 'grid-4x4' },
  { pares: 8,  filas: 4, cols: 4, tiempoSeg: 90,  nombre: 'Experto',    icon: '🏆', gridClass: 'grid-4x4' },
];

const EMOJIS_POOL = [
  '🐶','🐱','🐸','🦊','🐼','🦄','🐙','🦋',
  '🍕','🍦','🌈','🎈','🚀','🎸','⚽','🏆',
  '🌸','🍉','🎨','🦁','🐬','🌻','🎯','🦀'
];

const MENSAJES_ACIERTO = [
  { icon:'🧠', text:'¡Excelente memoria!', sub:'Guardaste esa imagen en tu mente.' },
  { icon:'⭐', text:'¡Lo recordaste!', sub:'Tu cerebro está aprendiendo.' },
  { icon:'🎯', text:'¡Perfecto!', sub:'Eso es concentración en acción.' },
  { icon:'🌟', text:'¡Muy bien!', sub:'Cada par encontrado fortalece tu memoria.' },
];

const MENSAJES_ERROR = [
  { icon:'💡', text:'¡Casi!', sub:'Recordá dónde está para la próxima.' },
  { icon:'🔍', text:'No coinciden...', sub:'Observá bien las posiciones.' },
  { icon:'🧩', text:'Seguí intentando.', sub:'Los errores también ayudan a aprender.' },
];

const TIPS = [
  { icon:'💡', text:'Truco pro: mirá bien las dos cartas antes de voltear.' },
  { icon:'🗺️', text:'Armá un mapa mental: "la estrella está arriba a la derecha".' },
  { icon:'🔢', text:'Contá posiciones: fila 2, columna 3.' },
  { icon:'🧘', text:'Respirá hondo antes de elegir. La calma ayuda a recordar.' },
];

let nivelActual = 0;
let tablero = [], cartasVolteadas = [], paresEncontrados = 0;
let bloqueado = false, timerID = null, segsRestantes = 0;
let intentos = 0, aciertos = 0, racha = 0, mejorRacha = 0;
let juegoActivo = false, tipIdx = 0;

function selectLevel(n) {
  nivelActual = n;
  document.querySelectorAll('.level-btn').forEach((b,i) => b.classList.toggle('active', i === n));
  if (!juegoActivo) mostrarBienvenida();
}

function rand(arr) {
  const a = [...arr];
  for (let i = a.length-1; i > 0; i--) {
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

function fmtTiempo(s) {
  return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;
}

function render(html) {
  document.getElementById('app-content').innerHTML = html;
}

// ──── PANTALLA BIENVENIDA ────
function mostrarBienvenida() {
  juegoActivo = false;
  clearInterval(timerID);
  const cfg = CONFIGS[nivelActual];
  const colores = ['#e0f5ec','#e8f4fd','#fff7e0'];
  const color = colores[nivelActual];

  render(`
    <div class="pantalla">
      <span class="pantalla-icon">${cfg.icon}</span>
      <div class="pantalla-title">Nivel ${cfg.nombre}</div>
      <p class="pantalla-body">
        Vas a ver <strong>${cfg.pares * 2} cartas</strong> boca abajo. Encontrá los
        <strong>${cfg.pares} pares</strong> iguales antes de que se acabe el tiempo.
        Usá tu memoria visual para recordar dónde están.
      </p>
      <div class="skills-worked">
        <div class="sw-chip">🧠 Memoria visual</div>
        <div class="sw-chip">👁️ Atención</div>
        <div class="sw-chip">🗺️ Orientación espacial</div>
        ${nivelActual >= 1 ? '<div class="sw-chip">⚡ Velocidad</div>' : ''}
        ${nivelActual === 2 ? '<div class="sw-chip">🎯 Estrategia</div>' : ''}
      </div>
      <button class="btn-primary teal" onclick="iniciarJuego()">
        🚀 ¡Empezar a jugar!
      </button>
      <div class="teacher-note">
        <div class="tn-title">📋 Para docentes</div>
        <div class="tn-body">
          Este nivel trabaja la <strong>memoria de trabajo visual</strong> y la
          <strong>atención sostenida</strong>. Invitá a los chicos a describir en voz alta
          qué estrategia usan para recordar las posiciones.
          Tiempo disponible: <strong>${fmtTiempo(cfg.tiempoSeg)}</strong>.
        </div>
      </div>
    </div>
  `);
}

// ──── INICIAR JUEGO ────
function iniciarJuego() {
  const cfg = CONFIGS[nivelActual];
  const emojis = rand(EMOJIS_POOL).slice(0, cfg.pares);
  tablero = rand([...emojis, ...emojis]);
  cartasVolteadas = [];
  paresEncontrados = 0;
  bloqueado = false;
  intentos = 0; aciertos = 0; racha = 0; mejorRacha = 0;
  segsRestantes = cfg.tiempoSeg;
  juegoActivo = true;
  tipIdx = 0;

  renderJuego();
  clearInterval(timerID);
  timerID = setInterval(() => {
    segsRestantes--;
    actualizarStats();
    if (segsRestantes > 0 && segsRestantes % 30 === 0) mostrarTip();
    if (segsRestantes <= 0) { clearInterval(timerID); mostrarDerrota(); }
  }, 1000);
}

function renderJuego() {
  const cfg = CONFIGS[nivelActual];
  render(`
    <div class="stats-row">
      <div class="stat">
        <span class="stat-val" id="sv-timer">${fmtTiempo(segsRestantes)}</span>
        <span class="stat-label">Tiempo</span>
      </div>
      <div class="stat">
        <span class="stat-val" id="sv-pares">0/${cfg.pares}</span>
        <span class="stat-label">Pares</span>
      </div>
      <div class="stat">
        <span class="stat-val" id="sv-racha">0</span>
        <span class="stat-label">Racha 🔥</span>
      </div>
      <div class="stat">
        <span class="stat-val" id="sv-intentos">0</span>
        <span class="stat-label">Intentos</span>
      </div>
    </div>

    <div class="board-wrap">
      <div class="tablero ${cfg.gridClass}" id="tablero"></div>
    </div>

    <div class="feedback-bar hidden" id="feedback-bar">
      <span class="fb-icon" id="fb-icon">💡</span>
      <div>
        <div class="fb-text" id="fb-text"></div>
        <div class="fb-sub" id="fb-sub"></div>
      </div>
    </div>

    <div class="progress-wrap">
      <div class="progress-label">
        <span>Progreso</span>
        <span id="pct-lbl">0%</span>
      </div>
      <div class="progress-track">
        <div class="progress-fill" id="progress-fill"></div>
      </div>
    </div>
  `);
  construirTablero();
}

function construirTablero() {
  const div = document.getElementById('tablero');
  if (!div) return;
  div.innerHTML = '';
  tablero.forEach((emoji, i) => {
    const c = document.createElement('div');
    c.className = 'carta';
    c.dataset.idx = i;
    c.innerHTML = `
      <div class="carta-inner">
        <div class="cara cara-dorso">
          <div class="cara-dorso-pattern">
            ${Array(9).fill('<span></span>').join('')}
          </div>
        </div>
        <div class="cara cara-frente">${emoji}</div>
      </div>`;
    c.addEventListener('click', () => voltear(c, i));
    div.appendChild(c);
  });
}

function actualizarStats() {
  const sv = document.getElementById('sv-timer');
  if (!sv) return;
  sv.textContent = fmtTiempo(segsRestantes);
  sv.className = 'stat-val';
  if (segsRestantes <= 10) sv.classList.add('timer-crit');
  else if (segsRestantes <= 30) sv.classList.add('timer-low');

  const cfg = CONFIGS[nivelActual];
  document.getElementById('sv-pares').textContent = `${paresEncontrados}/${cfg.pares}`;
  document.getElementById('sv-racha').textContent = racha;
  document.getElementById('sv-intentos').textContent = intentos;

  const pct = Math.round((paresEncontrados / cfg.pares) * 100);
  const fill = document.getElementById('progress-fill');
  const lbl = document.getElementById('pct-lbl');
  if (fill) fill.style.width = pct + '%';
  if (lbl) lbl.textContent = pct + '%';
}

function mostrarFeedback(tipo, datos) {
  const bar = document.getElementById('feedback-bar');
  if (!bar) return;
  bar.className = 'feedback-bar ' + tipo;
  document.getElementById('fb-icon').textContent = datos.icon;
  document.getElementById('fb-text').textContent = datos.text;
  document.getElementById('fb-sub').textContent = datos.sub;
  clearTimeout(bar._t);
  bar._t = setTimeout(() => {
    if (bar) bar.classList.add('hidden');
  }, 2500);
}

function mostrarTip() {
  const tips = TIPS;
  const tip = tips[tipIdx % tips.length];
  tipIdx++;
  mostrarFeedback('tip', { icon: tip.icon, text: tip.text, sub: 'Estrategia de memoria' });
}

function voltear(carta, idx) {
  if (bloqueado) return;
  if (carta.classList.contains('volteada') || carta.classList.contains('encontrada')) return;
  carta.classList.add('volteada');
  cartasVolteadas.push({ carta, idx });

  if (cartasVolteadas.length === 2) {
    bloqueado = true;
    intentos++;
    const [a, b] = cartasVolteadas;
    if (tablero[a.idx] === tablero[b.idx]) {
      racha++;
      aciertos++;
      if (racha > mejorRacha) mejorRacha = racha;
      setTimeout(() => {
        a.carta.classList.remove('volteada');
        b.carta.classList.remove('volteada');
        a.carta.classList.add('encontrada');
        b.carta.classList.add('encontrada');
        cartasVolteadas = [];
        bloqueado = false;
        paresEncontrados++;
        actualizarStats();
        const msg = MENSAJES_ACIERTO[Math.floor(Math.random()*MENSAJES_ACIERTO.length)];
        let sub = msg.sub;
        if (racha >= 3) sub = `¡Racha de ${racha}! Tu cerebro está en llamas. 🔥`;
        mostrarFeedback('hit', { icon: msg.icon, text: msg.text, sub });
        if (paresEncontrados === CONFIGS[nivelActual].pares) {
          clearInterval(timerID);
          setTimeout(mostrarVictoria, 600);
        }
      }, 400);
    } else {
      racha = 0;
      a.carta.classList.add('error');
      b.carta.classList.add('error');
      const msg = MENSAJES_ERROR[Math.floor(Math.random()*MENSAJES_ERROR.length)];
      mostrarFeedback('miss', { icon: msg.icon, text: msg.text, sub: msg.sub });
      setTimeout(() => {
        a.carta.classList.remove('volteada','error');
        b.carta.classList.remove('volteada','error');
        cartasVolteadas = [];
        bloqueado = false;
      }, 950);
    }
  }
}

// ──── CALCULAR PUNTAJE ────
function calcularPuntaje() {
  const cfg = CONFIGS[nivelActual];
  const precision = intentos > 0 ? Math.round((aciertos / intentos) * 100) : 0;
  const bonus = Math.max(0, Math.round(segsRestantes * 0.8));
  const base = paresEncontrados * 100;
  const rachaBonus = mejorRacha * 20;
  return { total: base + bonus + rachaBonus, precision, bonus, base };
}

function estrellas(precision) {
  if (precision >= 80) return '⭐⭐⭐';
  if (precision >= 55) return '⭐⭐';
  return '⭐';
}

// ──── VICTORIA ────
function mostrarVictoria() {
  juegoActivo = false;
  const cfg = CONFIGS[nivelActual];
  const { total, precision } = calcularPuntaje();
  const ests = estrellas(precision);
  const tiempoUsado = cfg.tiempoSeg - segsRestantes;

  lanzarConfetti();

  render(`
    <div class="pantalla">
      <span class="pantalla-icon">🏆</span>
      <div class="pantalla-title win">¡Lo lograste! ${ests}</div>
      <p class="pantalla-body">
        Encontraste todos los pares. Tu cerebro trabajó muy bien hoy.
        Cada vez que practicás, tu memoria se vuelve más fuerte.
      </p>
      <div class="score-grid">
        <div class="sc-card">
          <span class="sc-val">${precision}%</span>
          <span class="sc-lbl">Precisión</span>
        </div>
        <div class="sc-card">
          <span class="sc-val">${fmtTiempo(tiempoUsado)}</span>
          <span class="sc-lbl">Tiempo</span>
        </div>
        <div class="sc-card">
          <span class="sc-val">${mejorRacha}</span>
          <span class="sc-lbl">Mejor racha</span>
        </div>
      </div>
      <div class="skills-worked" style="margin-bottom:18px">
        <div class="sw-chip">✅ Memoria visual</div>
        <div class="sw-chip">✅ Concentración</div>
        ${mejorRacha >= 3 ? '<div class="sw-chip">✅ Estrategia</div>' : ''}
        ${precision >= 70 ? '<div class="sw-chip">✅ Precisión</div>' : ''}
      </div>
      <button class="btn-primary teal" onclick="iniciarJuego()" style="margin-bottom:10px">
        🔄 Jugar de nuevo
      </button>
      <button class="btn-primary" onclick="mostrarBienvenida()" style="background:#7b5ea7;box-shadow:0 5px 18px rgba(123,94,167,0.3)">
        🎚️ Elegir nivel
      </button>
      <div class="teacher-note">
        <div class="tn-title">📋 Para reflexionar en clase</div>
        <div class="tn-body">
          Preguntá: <em>"¿Cómo recordaste dónde estaban las cartas?"</em>
          Fomentá que describan su estrategia (posición, color, zona del tablero).
          Esto desarrolla la <strong>metacognición</strong> y el vocabulario espacial.
        </div>
      </div>
    </div>
  `);
}

// ──── DERROTA ────
function mostrarDerrota() {
  juegoActivo = false;
  const cfg = CONFIGS[nivelActual];
  const { precision } = calcularPuntaje();

  render(`
    <div class="pantalla">
      <span class="pantalla-icon">⏰</span>
      <div class="pantalla-title lose">¡Se acabó el tiempo!</div>
      <p class="pantalla-body">
        Encontraste <strong>${paresEncontrados} de ${cfg.pares} pares</strong>.
        No te rindas: cada intento entrena tu memoria y es un paso adelante.
        ¡Los campeones son los que vuelven a intentarlo!
      </p>
      <div class="score-grid">
        <div class="sc-card">
          <span class="sc-val">${paresEncontrados}/${cfg.pares}</span>
          <span class="sc-lbl">Pares</span>
        </div>
        <div class="sc-card">
          <span class="sc-val">${precision}%</span>
          <span class="sc-lbl">Precisión</span>
        </div>
        <div class="sc-card">
          <span class="sc-val">${mejorRacha}</span>
          <span class="sc-lbl">Mejor racha</span>
        </div>
      </div>
      <div class="feedback-bar tip" style="margin-bottom:16px;text-align:left">
        <span class="fb-icon">💡</span>
        <div>
          <div class="fb-text">Consejo para la próxima</div>
          <div class="fb-sub">${TIPS[Math.floor(Math.random()*TIPS.length)].text}</div>
        </div>
      </div>
      <button class="btn-primary teal" onclick="iniciarJuego()" style="margin-bottom:10px">
        💪 ¡Intentar de nuevo!
      </button>
      <button class="btn-primary" onclick="mostrarBienvenida()" style="background:#7b5ea7;box-shadow:0 5px 18px rgba(123,94,167,0.3)">
        🎚️ Elegir nivel
      </button>
      <div class="teacher-note">
        <div class="tn-title">📋 Para docentes</div>
        <div class="tn-body">
          El error es parte del aprendizaje. Celebrá el esfuerzo y preguntá:
          <em>"¿Qué harías diferente la próxima vez?"</em>
          Esto trabaja la <strong>autorregulación</strong> y el aprendizaje estratégico.
        </div>
      </div>
    </div>
  `);
}

// ──── CONFETTI ────
function lanzarConfetti() {
  const wrap = document.getElementById('confetti');
  wrap.innerHTML = '';
  const colors = ['#2ec4b6','#ffb703','#ff6b6b','#7b5ea7','#43e97b','#4facfe','#f093fb'];
  for (let i = 0; i < 70; i++) {
    const p = document.createElement('div');
    p.className = 'cp';
    p.style.cssText = `
      left:${Math.random()*100}vw;
      top:-12px;
      width:${Math.random()*10+7}px;
      height:${Math.random()*10+7}px;
      background:${colors[Math.floor(Math.random()*colors.length)]};
      border-radius:${Math.random()>.5?'50%':'3px'};
      animation-duration:${Math.random()*2+1.5}s;
      animation-delay:${Math.random()*1.2}s;
    `;
    wrap.appendChild(p);
  }
  setTimeout(() => { wrap.innerHTML = ''; }, 4500);
}

// ──── INIT ────
mostrarBienvenida();
</script>
</body>
</html>
