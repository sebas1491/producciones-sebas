<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Python Academy - Arcade Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- CodeMirror -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/theme/dracula.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/python/python.min.js"></script>
    <!-- Pyodide -->
    <script src="https://cdn.jsdelivr.net/pyodide/v0.23.4/full/pyodide.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Roboto+Mono:wght@400;500&family=Ubuntu:wght@500;700&display=swap');

        .CodeMirror { 
            height: 100%; 
            font-family: 'Roboto Mono', monospace; 
            font-size: 14px; 
            background: transparent !important; 
        }
        
        .custom-scrollbar::-webkit-scrollbar { width: 8px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; border: 2px solid #0f172a; }
        .hidden-view { display: none !important; }
        
        .arcade-font {
            font-family: 'Press Start 2P', cursive;
            line-height: 1.5;
            text-shadow: 3px 3px 0px #1e40af;
        }
        
        .game-button {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            border: 2px solid transparent;
        }
        
        .game-button:hover {
            transform: scale(1.05);
            border-color: #3b82f6;
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.4);
            background-color: rgba(30, 41, 59, 0.8);
            color: white;
        }

        .desc-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease-out, padding 0.3s ease;
            background: rgba(15, 23, 42, 0.5);
            font-size: 0.875rem;
            color: #94a3b8;
            border-bottom-left-radius: 0.5rem;
            border-bottom-right-radius: 0.5rem;
        }

        .desc-content.open {
            max-height: 500px;
            padding: 1rem;
            border-top: 1px solid rgba(59, 130, 246, 0.2);
        }

        .ex-item.active-btn {
            border-color: #3b82f6;
            background-color: rgba(30, 41, 59, 0.9);
            border-bottom-left-radius: 0;
            border-bottom-right-radius: 0;
        }

        .section-label {
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: #94a3b8;
        }

        .glass-panel {
            background: #1e1e1e;
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        #output-area {
            font-family: 'Roboto Mono', monospace !important;
            font-size: 15px !important;
            line-height: 1.6;
            white-space: pre-wrap;
            word-break: break-all;
        }
    </style>
</head>
<body class="bg-[#020617] text-slate-200 min-h-screen font-sans overflow-hidden">

    <!-- MENU INICIAL -->
    <div id="view-menu" class="h-screen flex flex-col items-center justify-center p-6 bg-[radial-gradient(circle_at_center,_var(--tw-gradient-stops))] from-blue-900/20 via-[#020617] to-[#020617]">
        <div class="mb-12 flex flex-row items-center justify-center gap-8 max-w-4xl">
            <img src="https://images.vexels.com/media/users/3/166477/isolated/preview/9bb722f0e85ddbc1ce0f064534fd2311-icono-del-lenguaje-de-programacion-python.png" 
                 alt="[Logotipo de Python]" 
                 class="w-24 h-24 md:w-32 md:h-32 drop-shadow-[0_0_15px_rgba(59,130,246,0.5)]">
            
            <div class="h-24 w-1 bg-blue-600 rounded-full hidden md:block opacity-50"></div>

            <div class="flex flex-col">
                <h1 class="arcade-font text-lg md:text-2xl text-white tracking-widest text-center md:text-left">
                    PRIMEROS PASOS<br>
                    <span class="text-blue-500">EN PYTHON</span>
                </h1>
            </div>
        </div>

        <div class="flex flex-col gap-3 w-full max-w-md" id="categories-grid"></div>
        
        <div id="init-status" class="mt-12 flex items-center space-x-3 text-[9px] uppercase tracking-[0.2em] text-slate-500">
            <div id="status-dot" class="w-1.5 h-1.5 rounded-full bg-yellow-500 animate-ping"></div>
            <span id="status-text">Cargando Intérprete...</span>
        </div>
    </div>

    <!-- VISTA DEL LABORATORIO -->
    <div id="view-lab" class="h-screen flex flex-col hidden-view bg-[#0f172a]">
        <header class="h-14 bg-[#1e293b] border-b border-slate-700 flex items-center justify-between px-6 shrink-0 shadow-2xl z-10">
            <div class="flex items-center space-x-4">
                <button onclick="showMenu()" class="flex items-center text-slate-400 hover:text-white transition-colors text-[10px] font-bold tracking-widest uppercase">
                    <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                    ATRÁS
                </button>
                <div class="h-6 w-[1px] bg-slate-700"></div>
                <h2 id="current-category-name" class="font-bold text-blue-400 text-[11px] uppercase tracking-[0.2em]">Categoría</h2>
            </div>
            <button onclick="runCode()" id="run-btn" disabled class="bg-blue-600 hover:bg-blue-500 text-white px-8 py-2 rounded-sm text-[10px] font-black tracking-widest flex items-center transition-all disabled:opacity-20 shadow-lg shadow-blue-900/40">
                <svg class="w-4 h-4 mr-2" fill="currentColor" viewBox="0 0 20 20"><path d="M4.5 3a.5.5 0 00-.5.5v13a.5.5 0 00.81.39l10.5-6.5a.5.5 0 000-.78l-10.5-6.5A.5.5 0 004.5 3z"/></svg>
                EJECUTAR
            </button>
        </header>

        <div class="flex-1 flex overflow-hidden p-3 gap-3">
            <aside class="w-80 bg-[#161f31]/50 border border-slate-800 rounded-xl flex flex-col shrink-0 overflow-hidden">
                <div class="p-4 bg-[#1e293b]/50 border-b border-slate-800">
                    <span class="section-label">Misiones</span>
                </div>
                <div class="flex-1 overflow-y-auto custom-scrollbar p-3 space-y-3" id="exercises-list"></div>
            </aside>

            <main class="flex-1 glass-panel flex flex-col relative">
                <div class="h-10 bg-[#1a1a1a] border-b border-white/5 flex items-center px-4 shrink-0">
                    <span class="section-label !text-blue-400/80">Editor</span>
                </div>
                <div class="flex-1 relative overflow-hidden bg-[#1e1e1e]">
                    <textarea id="code-editor"></textarea>
                </div>
            </main>

            <aside class="w-[420px] glass-panel bg-black flex flex-col shrink-0 border border-slate-800/50">
                <div class="h-10 bg-[#111] border-b border-white/5 flex items-center justify-between px-4 shrink-0">
                    <span class="section-label !text-green-500/80">Consola</span>
                    <button onclick="clearConsole()" class="text-slate-600 hover:text-white text-[9px] tracking-widest uppercase font-bold">Limpiar</button>
                </div>
                <div id="output-area" class="flex-1 p-6 overflow-y-auto text-slate-300 custom-scrollbar"></div>
                
                <div id="input-container" class="hidden bg-[#0f172a] border-t-2 border-slate-800 p-4 transition-all">
                    <div class="flex items-center bg-black/40 rounded-lg p-3 border border-slate-700" id="input-wrapper">
                        <span class="text-blue-500 font-bold mr-3 animate-pulse">>>></span>
                        <input type="text" id="user-input" class="flex-1 bg-transparent border-none outline-none text-white font-mono text-sm" placeholder="Escribe aquí y Enter..." autocomplete="off">
                    </div>
                </div>
            </aside>
        </div>
    </div>

    <script>
const guia = [
{
id: "es",
nombre: "Práctica de Entrada y Salida",
ejercicios: [
{ id: 1, t: "1) Hola mundo", d: "Al aprender un nuevo lenguaje de programación usualmente empezamos por lo que llamamos “¡Hola Mundo!”. Es un programa que sólo imprime “¡Hola Mundo!” en la salida.", c: " " },

{ id: 2, t: "2) ASPO", d: "En Argentina se realizó un aislamiento social preventivo y obligatorio. Dependiendo de tu provincia tuvo distintas duraciones.\nVamos a preguntar 40 veces al presidente si ya terminó la cuarentena.\nTexto: Alberto, ¿terminó la cuarentena?\n¿Cómo repetimos en este nuevo lenguaje?", c: " " },

{ id: 3, t: "3) Castigado", d: "En otra época, cuando un alumno/a se ‘portaba mal’ se le encomendaba una tarea como castigo: escribir muchas veces lo mismo.\nVamos a elaborar un programa que realice esa tarea por nosotros: debe capturar una frase y una cantidad, para luego imprimir por pantalla la frase la cantidad de veces ingresada.", c: " " },

{ id: 4, t: "4) Saludar al usuario", d: "Ahora le vamos a solicitar al usuario que ingrese su nombre.\nLuego su programa al ejecutar, debe utilizar dicho nombre para escribir en la salida un mensaje personalizado, por ejemplo: “Hola! Rene”.", c: " " },

{ id: 5, t: "5) Comentar sobre el nombre del usuario", d: "Vamos a elaborar un nuevo programa interactivo que, luego de solicitar el ingreso de un nombre, muestre un comentario personalizado e informe la cantidad de letras que tiene el nombre.\nPara conseguirlo podremos seguir dos simples pasos:\n1. Permitir que la persona ingrese su nombre,\n2. Mostrar un mensaje personalizado que incluya el nombre ingresado.\nEjemplo: Eva, ¡ese es un hermoso nombre!\n3. Mostrar un mensaje que incluya la cantidad de letras del nombre ingresado.\nEjemplo: Eva, tu nombre tiene 3 letras.\nNo nos olvidemos de separar las tareas en procedimientos.", c: " " },

{ id: 6, t: "6) La (letra) elegida", d: "Vamos a elaborar un nuevo programa interactivo que, luego de solicitar el ingreso de una frase y un número, muestre la letra que se encuentra en la posición indicada por el número.\nPara conseguirlo, podremos seguir estos pasos:\n1. Solicitar el ingreso de una frase.\n2. Solicitar el ingreso de un número.\n3. Mostrar la letra correspondiente.\n¿Seguro?, ¿se cuenta desde cero o desde uno?", c: " " }
]},

{
id: "repeticion",
nombre: "Repetición y Alternativas condicionales",
ejercicios: [
{ id: 7, t: "7) Comentando nombres (v2)", d: "Vamos a elaborar un nuevo programa interactivo que, luego de solicitar el ingreso de un nombre, muestre un comentario personalizado según se trate de un nombre corto (hasta 5 letras) o largo (más de 5 letras).", c: " " },

{ id: 8, t: "8) El autómata que puede contar", d: "Nos proponemos elaborar un programa con capacidad de contar desde 1 hasta 10.\n¿Parece complicado? ¡Estamos preparados!", c: " " },

{ id: 9, t: "9) Eco", d: "Vamos a elaborar un nuevo programa interactivo que, luego de solicitar el ingreso de la profundidad en metros de una cueva, muestre esa cantidad de veces la palabra “Eco” en la salida.", c: " " },

{ id: 10, t: "10) Cuenta Regresiva", d: "Vamos a elaborar un nuevo programa con capacidad de conteo.\nEsta vez se trata de la cuenta regresiva propia de los lanzamientos de cohetes.", c: " " },

{ id: 11, t: "11) Zamba viaja al pasado", d: "Vamos a elaborar un programa interactivo donde el usuario ingresa un año en el pasado y el programa simula el viaje mostrando cada año recorrido.", c: " " },

{ id: 12, t: "12) Deletreando nombres", d: "Vamos a elaborar un nuevo programa interactivo con capacidad de deletrear nombres.\nEl resultado debería mostrar en la salida una línea con cada una de las letras del nombre ingresado.", c: " " },

{ id: 13, t: "13) Acá hay una vocal", d: "Elaborar un nuevo programa interactivo que luego de ingresar un texto, imprima la frase “Acá hay una vocal” por cada vocal que tenga el texto ingresado.", c: " " }
]},

{
id: "logica",
nombre: "Operaciones relacionales y lógicas",
ejercicios: [
{ id: 14, t: "14) La (letra) elegida (V2)", d: "Retomar el ejercicio anterior y modificarlo para validar posiciones fuera de rango e indicar si hay espacio en la posición elegida.", c: " " },

{ id: 15, t: "15) Tenés que trabajar", d: "En Argentina si sos mujer a los 60 años te jubilás y si sos varón a los 65 años te jubilás.\nA los menores de 18 los mandaremos de vacaciones junto al grupo que se jubila.\nAl resto los mandaremos a trabajar.", c: " " }
]},

{
id: "juegos",
nombre: "Variables y Tipos de datos",
ejercicios: [
{ id: 16, t: "16) Mulero", d: "Juego simple donde el usuario ingresa un número y la computadora siempre gana.", c: " " },

{ id: 17, t: "17) Porciones de pizza", d: "Calcular cuántas porciones de pizza sobran sabiendo que cada pizza tiene 8 porciones y todas las personas comen la misma cantidad.", c: " " },

{ id: 18, t: "18) Generador de apócopes", d: "Programa que acorta nombres largos generando un apócope.", c: " " },

{ id: 19, t: "19) Calentito", d: "Juego donde se tiran dados, se acumulan puntos y el jugador decide si seguir o plantarse.", c: " " }
]},

{
id: "programas",
nombre: "Programas interactivos",
ejercicios: [
{ id: 20, t: "20) Monedero Electrónico", d: "Programa interactivo que simula cargar, descontar y consultar saldo.", c: " " },

{ id: 21, t: "21) Fortaleza de Contraseña", d: "Programa que indica si una contraseña es fuerte, débil o media según ciertos criterios.", c: " " }
]}
];
        let pyodide;
        let editor;
        let currentResolver = null;

        async function init() {
            editor = CodeMirror.fromTextArea(document.getElementById('code-editor'), {
                mode: "python", theme: "dracula", lineNumbers: true, indentUnit: 4, matchBrackets: true
            });

            const grid = document.getElementById('categories-grid');
            guia.forEach(cat => {
                const btn = document.createElement('button');
                btn.className = "game-button w-full py-4 px-6 bg-slate-900 border-2 border-slate-800 rounded-lg text-[12px] font-bold tracking-widest uppercase text-slate-400 hover:text-white shadow-inner text-left flex justify-between items-center";
                btn.onclick = () => loadCategory(cat);
                btn.innerHTML = `<span>${cat.nombre}</span> <span class="text-blue-500">>></span>`;
                grid.appendChild(btn);
            });

            try {
                pyodide = await loadPyodide({
                    stdout: (text) => appendOutput(text + "\n", "text-slate-300"),
                    stderr: (text) => appendOutput(text + "\n", "text-red-400")
                });
                
                pyodide.registerJsModule("custom_io", {
                    js_input_bridge: (promptText) => {
                        appendOutput(promptText, "text-blue-400 font-bold");
                        return new Promise(resolve => {
                            currentResolver = resolve;
                            const container = document.getElementById('input-container');
                            container.classList.remove('hidden');
                            document.getElementById('user-input').focus();
                        });
                    }
                });

                await pyodide.runPythonAsync(`
import builtins, sys, custom_io, asyncio, time
async def async_input(prompt=""):
    return await custom_io.js_input_bridge(prompt)
builtins.input = async_input
async def async_sleep(delay):
    await asyncio.sleep(delay)
time.sleep = async_sleep
                `);
                
                document.getElementById('status-dot').classList.replace('bg-yellow-500', 'bg-green-500');
                document.getElementById('status-text').innerText = "Sistema Listo";
                document.getElementById('run-btn').disabled = false;
            } catch (err) { console.error(err); }

            const inputField = document.getElementById('user-input');
            inputField.onkeypress = (e) => {
                if (e.key === 'Enter' && currentResolver) {
                    const v = inputField.value;
                    appendOutput(v + "\n", "text-white italic");
                    inputField.value = "";
                    document.getElementById('input-container').classList.add('hidden');
                    const res = currentResolver; 
                    currentResolver = null; 
                    res(v);
                }
            };
        }

        function loadCategory(cat) {
            document.getElementById('current-category-name').innerText = cat.nombre;
            const list = document.getElementById('exercises-list');
            list.innerHTML = "";
            cat.ejercicios.forEach(ex => {
                const item = document.createElement('div');
                item.className = "mb-2 overflow-hidden";
                item.innerHTML = `
                    <button id="btn-${ex.id}" onclick="selectEx(${ex.id}, '${cat.id}')" class="ex-item w-full text-left p-4 bg-slate-800/20 hover:bg-slate-800/40 border border-slate-800 rounded-lg transition-all flex justify-between items-center group">
                        <span class="ex-title text-slate-300 group-hover:text-white uppercase tracking-tight font-bold text-xs">${ex.t}</span>
                    </button>
                    <div id="desc-${ex.id}" class="desc-content">${ex.d}</div>
                `;
                list.appendChild(item);
            });
            document.getElementById('view-menu').classList.add('hidden-view');
            document.getElementById('view-lab').classList.remove('hidden-view');
            editor.refresh();
        }

        function selectEx(id, catId) {
            const cat = guia.find(c => c.id === catId);
            const ex = cat.ejercicios.find(e => e.id === id);
            document.querySelectorAll('.desc-content').forEach(d => d.classList.remove('open'));
            document.querySelectorAll('.ex-item').forEach(b => b.classList.remove('active-btn'));
            document.getElementById(`desc-${id}`).classList.add('open');
            document.getElementById(`btn-${id}`).classList.add('active-btn');
            editor.setValue(ex.c);
            clearConsole();
        }

        function showMenu() {
            document.getElementById('view-lab').classList.add('hidden-view');
            document.getElementById('view-menu').classList.remove('hidden-view');
        }

        function appendOutput(t, c = "text-slate-300") {
            const o = document.getElementById('output-area');
            const lines = t.split('\n');
            lines.forEach(line => {
                if (line.trim() === "" && lines.length > 1) return;
                const s = document.createElement('div');
                s.className = c; 
                s.innerText = line;
                o.appendChild(s);
            });
            o.scrollTop = o.scrollHeight;
        }

        function clearConsole() { document.getElementById('output-area').innerHTML = ""; }

        async function runCode() {
            const code = editor.getValue();
            const btn = document.getElementById('run-btn');
            btn.disabled = true;
            appendOutput(`> Ejecutando...\n`, "text-blue-500/50 text-[10px] font-bold mb-2");
            
            try {
                pyodide.globals.set("user_code_string", code);
                const transformerScript = `
import ast

class AsyncTransformer(ast.NodeTransformer):
    def visit_FunctionDef(self, node):
        self.generic_visit(node)
        new_node = ast.AsyncFunctionDef(
            name=node.name,
            args=node.args,
            body=node.body,
            decorator_list=node.decorator_list,
            returns=node.returns,
            type_comment=node.type_comment
        )
        ast.copy_location(new_node, node)
        return new_node

    def visit_Call(self, node):
        self.generic_visit(node)
        sync_builtins = ['print', 'int', 'float', 'str', 'len', 'range', 'list', 'dict', 'set', 'bool', 'any', 'all', 'sum', 'min', 'max', 'type', 'randint']
        
        # Siempre hacemos await de funciones llamadas por el usuario y de input
        if isinstance(node.func, ast.Name):
            if node.func.id == 'input':
                return ast.Await(value=node)
            # Si no es un built-in sincrono, asumimos que es una funcion def (que ahora es async)
            if node.func.id not in sync_builtins:
                return ast.Await(value=node)
        
        if isinstance(node.func, ast.Attribute):
            if node.func.attr == 'sleep':
                return ast.Await(value=node)
        return node

    def inject_sleep(self, node):
        self.generic_visit(node)
        respiro = ast.Expr(value=ast.Await(value=ast.Call(
            func=ast.Attribute(value=ast.Name(id='time', ctx=ast.Load()), attr='sleep', ctx=ast.Load()),
            args=[ast.Constant(value=0.001)], keywords=[]
        )))
        node.body.insert(0, respiro)
        return node

    visit_For = inject_sleep
    visit_While = inject_sleep

tree = ast.parse(user_code_string)
transformer = AsyncTransformer()
transformer.visit(tree)
ast.fix_missing_locations(tree)

user_ast_unparsed = ast.unparse(tree)
modified_code = "import asyncio\\nasync def __run__():\\n" + "\\n".join("    " + line for line in user_ast_unparsed.split("\\n")) + "\\nasyncio.ensure_future(__run__())"
modified_code
                `;
                const finalCode = pyodide.runPython(transformerScript);
                await pyodide.runPythonAsync(finalCode);
            } catch (err) {
                appendOutput("ERROR: " + err.message + "\n", "text-red-400");
            } finally {
                setTimeout(() => { btn.disabled = false; }, 500);
            }
        }

        window.onload = init;
    </script>
</body>
</html>
